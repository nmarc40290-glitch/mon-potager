<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potager SQL Dynamique PRO</title>
    <style>
        :root { 
            --primary: #2e7d32; --bg: #f4f9f4; --accent: #4caf50; --danger: #d32f2f; 
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        nav { background: var(--primary); color: white; padding: 10px; display: flex; gap: 10px; align-items: center; z-index: 1000; }
        .nav-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.8em; }

        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        .sidebar { width: 260px; background: white; border-right: 1px solid #ddd; padding: 15px; position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: 0.3s; z-index: 1100; box-shadow: 5px 0 15px rgba(0,0,0,0.1); }
        .sidebar.open { transform: translateX(0); }
        
        .content-area { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .section { display: none; }
        .section.active { display: block; }

        /* TABLEAU SQL DYNAMIQUE */
        .sql-table-container { width: 100%; overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; font-size: 0.75em; min-width: 1000px; }
        th { background: #34495e; color: white; padding: 10px; text-align: left; position: sticky; top: 0; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f9f9f9; cursor: pointer; }

        /* FORMULAIRE */
        form { background: white; padding: 20px; border-radius: 12px; max-width: 500px; margin: 0 auto; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        label { display: block; font-size: 0.8em; font-weight: bold; margin-top: 10px; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        
        .custom-field-row { background: #e8f5e9; padding: 10px; border-radius: 6px; margin-top: 10px; border: 1px dashed var(--accent); position: relative; }
        .btn-remove-field { position: absolute; top: 5px; right: 5px; color: var(--danger); border: none; background: none; font-weight: bold; cursor: pointer; }
        
        .btn-add-field { background: #f1f1f1; border: 1px solid #ccc; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 15px 0; }

        .plante-card { background: white; border: 1px solid #ddd; padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; }
        .zone-box { margin-bottom: 20px; border-left: 5px solid var(--primary); padding-left: 10px; }

        .fab-add { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 30px; z-index: 2000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; }
    </style>
</head>
<body>

<nav>
    <div onclick="toggleSidebar()" style="cursor:pointer; font-weight:900; margin-right:10px;">☰</div>
    <button class="nav-btn" onclick="switchTab('tab-liste')">LISTE</button>
    <button class="nav-btn" onclick="switchTab('tab-sql')">TABLEAU SQL</button>
</nav>

<div class="main-container">
    <aside id="sidebar" class="sidebar">
        <h3>Menu</h3>
        <button onclick="exportData()" style="width:100%; padding:10px; margin-bottom:10px;">📤 Exporter JSON (Tout)</button>
        <button onclick="document.getElementById('fileInput').click()" style="width:100%; padding:10px;">📥 Importer JSON</button>
        <input type="file" id="fileInput" style="display:none" onchange="importData(event)">
        <div id="sidebar-filters" style="margin-top:20px;"></div>
    </aside>

    <main class="content-area">
        <div id="tab-liste" class="section active"><div id="affichageDonnees"></div></div>

        <div id="tab-sql" class="section">
            <div class="sql-table-container">
                <table>
                    <thead id="sql-head"></thead>
                    <tbody id="sql-body"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-saisie" class="section">
            <form id="pForm">
                <input type="hidden" id="edit-id">
                <label>Nom du légume</label>
                <input type="text" id="p_nom" required>
                
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;"><label>Zone</label><input type="text" id="p_zone"></div>
                    <div style="flex:1;"><label>Rang</label><select id="p_rang"></select></div>
                </div>

                <label>Date Semis/Plantation</label><input type="date" id="p_date">
                
                <!-- Zone des champs dynamiques -->
                <div id="dynamic-fields"></div>
                
                <button type="button" class="btn-add-field" onclick="promptNewField()">➕ AJOUTER CHAMP PERSONNALISÉ</button>

                <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
                    <button type="button" onclick="validerFormulaire()" style="background:var(--primary); color:white; padding:15px; border:none; border-radius:8px; font-weight:bold;">💾 ENREGISTRER DANS LA BASE</button>
                    <button type="button" onclick="switchTab('tab-liste')" style="background:#ccc; padding:10px; border:none; border-radius:8px;">ANNULER</button>
                </div>
            </form>
        </div>
    </main>
</div>

<button class="fab-add" onclick="ouvrirAjout()">+</button>

<script>
let monPotager = JSON.parse(localStorage.getItem("data_potager")) || [];
// Liste des champs "système" à ne pas traiter comme dynamiques
const SYSTEM_FIELDS = ['id', 'nom', 'zone', 'numero', 'date', 'statut', 'rang', 'typeInit', 'recolte', 'dateLevee', 'dateRecolte', 'dateFin'];

// --- INITIALISATION ---
const selectRang = document.getElementById('p_rang');
for(let i=1; i<=30; i++) { 
    let o = document.createElement('option'); o.value = i; o.innerText = "Rang " + i; 
    selectRang.appendChild(o); 
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

function switchTab(t) { 
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(t).classList.add('active');
    if(t === 'tab-liste') afficherPotager();
    if(t === 'tab-sql') afficherTableauSQL();
    document.getElementById('sidebar').classList.remove('open');
}

// --- LOGIQUE CHAMPS LIBRES ---

function promptNewField() {
    // On cherche les colonnes déjà existantes dans le SQL pour les proposer
    let existingExtraKeys = new Set();
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes.forEach(p => {
        Object.keys(p).forEach(k => { if(!SYSTEM_FIELDS.includes(k)) existingExtraKeys.add(k); });
    })));

    let msg = "Nom du nouveau champ ?\n";
    if(existingExtraKeys.size > 0) msg += "(Existant dans SQL : " + Array.from(existingExtraKeys).join(', ') + ")";
    
    let key = prompt(msg);
    if(key) createFieldInput(key, "");
}

function createFieldInput(key, value) {
    const container = document.getElementById('dynamic-fields');
    const div = document.createElement('div');
    div.className = 'custom-field-row';
    div.innerHTML = `
        <button type="button" class="btn-remove-field" onclick="this.parentElement.remove()">✕</button>
        <label>${key.toUpperCase()}</label>
        <input type="text" class="custom-data" data-key="${key}" value="${value}">
    `;
    container.appendChild(div);
}

// --- CORE FUNCTIONS ---

function validerFormulaire() {
    const nom = document.getElementById('p_nom').value;
    if(!nom) return;

    // Création de l'objet de base
    const p = {
        id: document.getElementById('edit-id').value ? parseInt(document.getElementById('edit-id').value) : Date.now(),
        nom: nom,
        date: document.getElementById('p_date').value
    };

    // Injection automatique de tous les champs dynamiques créés
    document.querySelectorAll('.custom-data').forEach(input => {
        p[input.dataset.key] = input.value;
    });

    const zN = document.getElementById('p_zone').value.toUpperCase() || "A";
    const rN = document.getElementById('p_rang').value;

    // Nettoyage et Sauvegarde
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(x => x.id !== p.id)));
    let z = monPotager.find(x => x.nom === zN); if(!z){z={nom:zN, rangs:[]}; monPotager.push(z);}
    let r = z.rangs.find(x => x.numero === rN); if(!r){r={numero:rN, plantes:[]}; z.rangs.push(r);}
    r.plantes.push(p);
    
    localStorage.setItem("data_potager", JSON.stringify(monPotager));
    switchTab('tab-liste');
}

function afficherTableauSQL() {
    const head = document.getElementById('sql-head');
    const body = document.getElementById('sql-body');
    
    // Découverte dynamique de TOUTES les colonnes présentes dans les données
    let columns = new Set(['id', 'zone', 'rang', 'nom', 'date']);
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes.forEach(p => {
        Object.keys(p).forEach(k => { if(!['recolte','typeInit'].includes(k)) columns.add(k); });
    })));

    let colArray = Array.from(columns);
    head.innerHTML = `<tr>${colArray.map(c => `<th>${c.toUpperCase()}</th>`).join('')}</tr>`;
    
    body.innerHTML = "";
    monPotager.forEach((zone, zIdx) => zone.rangs.forEach((rang, rIdx) => rang.plantes.forEach((p, pIdx) => {
        let tr = document.createElement('tr');
        tr.onclick = () => preparerEdition(zIdx, monPotager[zIdx].rangs.indexOf(rang), pIdx);
        let content = "";
        colArray.forEach(c => {
            let val = (c === 'zone') ? zone.nom : (c === 'rang') ? rang.numero : (p[c] || "-");
            content += `<td>${val}</td>`;
        });
        tr.innerHTML = content;
        body.appendChild(tr);
    })));
}

function afficherPotager() {
    const container = document.getElementById('affichageDonnees'); container.innerHTML = "";
    monPotager.forEach((zone, zIdx) => {
        let cards = "";
        zone.rangs.forEach((rang, rIdx) => {
            rang.plantes.forEach((p, pIdx) => {
                cards += `<div class="plante-card" onclick="preparerEdition(${zIdx}, ${monPotager[zIdx].rangs.indexOf(rang)}, ${pIdx})">
                    <strong>${p.nom}</strong> <small>(Z:${zone.nom} R:${rang.numero})</small>
                </div>`;
            });
        });
        if(cards) container.innerHTML += `<div class="zone-box"><h3>ZONE ${zone.nom}</h3>${cards}</div>`;
    });
}

function preparerEdition(zi, ri, pi) {
    const p = monPotager[zi].rangs[ri].plantes[pi];
    ouvrirAjout();
    document.getElementById('edit-id').value = p.id;
    document.getElementById('p_nom').value = p.nom;
    document.getElementById('p_zone').value = monPotager[zi].nom;
    document.getElementById('p_rang').value = monPotager[zi].rangs[ri].numero;
    document.getElementById('p_date').value = p.date || "";

    // IMPORTANT : Re-générer les champs personnalisés dynamiquement à partir de l'objet
    Object.keys(p).forEach(k => {
        if(!SYSTEM_FIELDS.includes(k)) {
            createFieldInput(k, p[k]);
        }
    });
}

function ouvrirAjout() {
    document.getElementById('pForm').reset();
    document.getElementById('edit-id').value = "";
    document.getElementById('dynamic-fields').innerHTML = "";
    switchTab('tab-saisie');
}

// --- IMPORT / EXPORT (Persistance totale) ---

function exportData() {
    // JSON.stringify exporte TOUTES les clés de l'objet, même les personnalisées
    const blob = new Blob([JSON.stringify(monPotager)], {type: "application/json"});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "potager_complet_" + new Date().toLocaleDateString() + ".json";
    a.click();
}

function importData(e) {
    const reader = new FileReader();
    reader.onload = (ev) => { 
        try {
            const data = JSON.parse(ev.target.result);
            monPotager = data;
            localStorage.setItem("data_potager", JSON.stringify(monPotager));
            alert("Importation réussie : tous les champs personnalisés ont été chargés.");
            afficherPotager();
        } catch(err) {
            alert("Erreur de fichier JSON.");
        }
    };
    reader.readAsText(e.target.files[0]);
}

afficherPotager();
</script>
</body>
</html>
