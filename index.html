    <section id="page-form" class="page">
        <div class="form-card">
            <form id="potagerForm">
                <input type="hidden" id="f_id">
                
                <div class="field">
                    <label>Mode de culture</label>
                    <select id="f_typeInit">
                        <option value="semis">Semis (Graines)</option>
                        <option value="planter">Plantation (Plants)</option>
                    </select>
                </div>

                <div class="row">
                    <div class="field" style="flex:2;"><label>Nom du légume</label><input type="text" id="f_nom" required placeholder="Ex: Tomate"></div>
                    <div class="field" style="flex:1;"><label>Variété</label><input type="text" id="f_variete" placeholder="Marmande"></div>
                </div>

                <div class="row">
                    <div class="field"><label>Zone</label><input type="text" id="f_zone" placeholder="Ex: A"></div>
                    <div class="field"><label>Rang</label><input type="number" id="f_rang" value="1"></div>
                </div>

                <div class="field"><label id="lblDateAction">Date Action</label><input type="date" id="f_date"></div>
                
                <div class="field" id="fieldLevee" style="display:none;"><label>Date de levée (constatée)</label><input type="date" id="f_date_levee"></div>
                
                <div class="field">
                    <label>Période de récolte estimée (Orange sur planning)</label>
                    <div id="moisGrid" class="mois-grid">
                        </div>
                </div>

                <div class="field"><label>Date RÉELLE de début de récolte</label><input type="date" id="f_date_recolte_reelle"></div>
                
                <div class="field"><label>Date de fin / Arrachage</label><input type="date" id="f_date_fin"></div>
                
                <div class="field"><label>Notes & Suivi</label><textarea id="f_notes" rows="3"></textarea></div>

                <div class="form-actions-main">
                    <button type="submit" class="btn-action btn-main">💾 ENREGISTRER</button>
                    <button type="button" class="btn-action btn-light" id="btnCancel">Annuler</button>
                </div>

                <div id="area-edit-actions" class="form-actions-edit" style="display:none; margin-top:20px; border-top:1px solid #eee; padding-top:10px;">
                    <button type="button" class="btn-action btn-dup" id="btnDupliquer" style="background:#e8f5e9; color:#2e7d32;">👯 DUPLIQUER</button>
                    <button type="button" class="btn-action btn-delete" id="btnDelete">Supprimer cette fiche</button>
                </div>
            </form>
        </div>
    </section>
