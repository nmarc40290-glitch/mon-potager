 <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Potager - v1.6.0016</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { 
            --primary: #2e7d32; --primary-light: #e8f5e9; --accent: #4caf50; --danger: #d32f2f; 
            --bg: #f4f9f4; --text: #2c3e50; --info: #2196f3; --rain: #0288d1;
            --c-sous-terre: #2196f3; --c-attente: #9c27b0; --c-recolte: #1b5e20; --c-fini: #757575;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: var(--text); }
        nav { background: var(--primary); color: white; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; flex-shrink: 0; height: 50px; }
        .nav-left { display: flex; align-items: center; cursor: pointer; }
        .nav-version { font-size: 0.7em; font-weight: bold; background: rgba(0, 0, 0, 0.2); padding: 3px 8px; border-radius: 4px; font-family: monospace; flex-shrink: 0; }
        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        .sidebar { width: 280px; background: white; border-right: 1px solid #ddd; padding: 15px; overflow-y: auto; position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: 0.3s; z-index: 1100; box-shadow: 5px 0 15px rgba(0,0,0,0.1); }
        .sidebar.open { transform: translateX(0); }
        .nav-sidebar-item { display: block; padding: 12px 15px; color: #333; text-decoration: none; border-bottom: 1px solid #f9f9f9; cursor: pointer; font-size: 0.85em; background: #f8f9fa; border-left: 5px solid var(--primary); margin-bottom: 5px; font-weight: bold; }
        .content-area { flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .section { display: none; padding: 15px; }
        .section.active { display: block; }
        .water-row { display: flex; align-items: center; background: white; padding: 12px; margin-bottom: 5px; border-radius: 8px; border: 1px solid #eee; }
        .water-row input[type="checkbox"] { width: 25px; height: 25px; margin-right: 15px; accent-color: var(--info); }
        .planning-container { width: 100%; overflow-x: auto; background: white; border-radius: 8px; border: 1px solid #ddd; }
        .plan-table { border-collapse: collapse; min-width: 100%; font-size: 0.75em; }
        .plan-table th, .plan-table td { border: 1px solid #eee; padding: 4px; text-align: center; height: 65px; min-width: 95px; }
        .sticky-col { position: sticky; left: 0; background: #fff !important; z-index: 10; min-width: 150px; text-align: left !important; font-weight: bold; box-shadow: 2px 0 5px rgba(0,0,0,0.05); }
        .zone-box { background: white; margin-bottom: 20px; border-radius: 12px; border-left: 8px solid var(--primary); padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .plante-card { background: #fff; border: 1px solid #eee; margin: 10px 0; padding: 15px; border-radius: 10px; cursor: pointer; position: relative; }
        .status-badge { float: right; font-size: 0.7em; padding: 5px 10px; border-radius: 6px; color: white; font-weight: bold; }
        .st-bleu { background: var(--c-sous-terre); } .st-violet { background: var(--c-attente); } .st-vert { background: var(--c-recolte); } .st-gris { background: var(--c-fini); }
        .sql-table-container { width: 100%; overflow-x: auto; background: white; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75em; }
        th { background: #c0392b; color: white; padding: 10px; text-align: left; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        form { background: white; padding: 20px; border-radius: 12px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
        .mois-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #f9f9f9; padding: 10px; border-radius: 8px; }
        .fab-add { position: fixed; bottom: 25px; right: 25px; background: var(--accent); color: white; border: none; border-radius: 50%; width: 65px; height: 65px; font-size: 40px; cursor: pointer; z-index: 1001; }
        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-install { display: block; background: #ff9800; color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 15px; cursor: pointer; }
        .rain-row { background: white; padding: 10px; margin-bottom: 5px; border-radius: 8px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .rain-badge { background: var(--rain); color: white; padding: 2px 8px; border-radius: 12px; font-weight: bold; }
    </style>
</head>
<body>
<nav>
    <div class="nav-left" onclick="toggleSidebar()"><span style="font-weight:900;">☰ MENU POTAGER</span></div>
    <div class="nav-version">v.1.6.0016</div>
</nav>

<button class="fab-add" onclick="ouvrirAjout()">+</button>

<div class="main-container">
    <aside id="sidebar" class="sidebar">
        <a class="nav-sidebar-item" onclick="switchTab('tab-liste')">📋 VUE LISTE</a>
        <a class="nav-sidebar-item" onclick="switchTab('tab-arrosage')" style="border-left-color: var(--info);">💧 SUIVI ARROSAGE</a>
        <a class="nav-sidebar-item" onclick="switchTab('tab-pluie')" style="border-left-color: var(--rain);">🌧️ PLUVIOMÉTRIE</a>
        <a class="nav-sidebar-item" onclick="switchTab('tab-planning')">📅 VUE PLANNING</a>
        <a class="nav-sidebar-item" onclick="switchTab('tab-sql')">🗄️ TABLEAU SQL</a>
        <button id="installBtn" class="btn-install" onclick="installerApp()">📲 INSTALLER L'APPLI</button>
        <hr>
        <button class="btn-action" onclick="exportJSON()">📤 EXPORTER JSON</button>
        <button class="btn-action" onclick="document.getElementById('fileInput').click()">📥 IMPORTER DATA</button>
        <input type="file" id="fileInput" style="display:none" onchange="importJSON(event)">
    </aside>

    <main class="content-area">
        <div id="tab-liste" class="section active"><div id="affichageDonnees"></div></div>
        
        <div id="tab-arrosage" class="section">
            <div style="background:white; padding:15px; border-radius:12px; border:1px solid var(--info);">
                <label>Date de l'arrosage</label>
                <input type="date" id="water-date">
                <button class="btn-action" onclick="enregistrerArrosageBulk()" style="background:var(--info); color:white;">💾 VALIDER</button>
            </div>
            <div id="water-list" style="margin-top:15px;"></div>
        </div>

        <div id="tab-pluie" class="section">
            <div style="background:white; padding:15px; border-radius:12px; border:1px solid var(--rain);">
                <label>Date & Quantité (mm)</label>
                <input type="date" id="rain-date">
                <input type="number" id="rain-mm" placeholder="mm">
                <button class="btn-action" onclick="ajouterPluie()" style="background:var(--rain); color:white;">🌧️ ENREGISTRER</button>
            </div>
            <div id="rain-history" style="margin-top:15px;"></div>
        </div>

        <div id="tab-planning" class="section">
            <div class="planning-container">
                <table class="plan-table"><thead id="plan-head"></thead><tbody id="plan-body"></tbody></table>
            </div>
        </div>

        <div id="tab-sql" class="section">
            <div class="sql-table-container">
                <table id="sql-table"><thead><tr id="sql-head"></tr></thead><tbody id="sql-body"></tbody></table>
            </div>
        </div>

        <div id="tab-saisie" class="section">
            <form id="pForm">
                <input type="hidden" id="edit-id">
                <label>Nom</label><input type="text" id="p_nom" required>
                <label>Zone</label><input type="text" id="p_zone">
                <label>Rang</label><select id="p_rang"></select>
                <label><input type="checkbox" id="p_abris"> 🏠 Sous abris</label>
                <label>Date Début</label><input type="date" id="p_date">
                <label>Mois de Récolte</label>
                <div class="mois-grid" id="moisGrid"></div>
                <textarea id="p_notes" placeholder="Notes..."></textarea>
                <button type="button" class="btn-action" onclick="validerFormulaire()" style="background:var(--primary); color:white;">💾 ENREGISTRER</button>
                <button type="button" id="dup-btn" class="btn-action" style="background:var(--info); color:white; display:none;" onclick="dupliquerFiche()">👯 DUPLIQUER</button>
                <button type="button" id="del-btn" class="btn-action" style="background:var(--danger); color:white; display:none;" onclick="supprimerFiche()">🗑️ SUPPRIMER</button>
                <button type="button" class="btn-action" onclick="switchTab('tab-liste')">ANNULER</button>
            </form>
        </div>
    </main>
</div>

<script>
let monPotager = JSON.parse(localStorage.getItem("data_potager")) || [];
let pluviometrie = JSON.parse(localStorage.getItem("data_pluie")) || [];
const MOIS_NOM = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Juil", "Août", "Sept", "Oct", "Nov", "Déc"];
let deferredPrompt;

// Initialisation
for(let i=1; i<=30; i++) {
    let o = document.createElement('option'); o.value = i; o.innerText = "Rang " + i;
    document.getElementById('p_rang').appendChild(o);
}
MOIS_NOM.forEach(m => {
    document.getElementById('moisGrid').innerHTML += `<div style="display:flex; align-items:center; gap:4px;"><input type="checkbox" name="mr" value="${m}"><span style="font-size:0.7em">${m}</span></div>`;
});

window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });

async function installerApp() {
    if (deferredPrompt) { 
        deferredPrompt.prompt(); 
        await deferredPrompt.userChoice; 
        deferredPrompt = null; 
    } else { 
        alert("Pour installer :\n📱 iOS : Partager > Sur l'écran d'accueil\n🤖 Android : Menu > Installer"); 
    }
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

function switchTab(tabId) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if(tabId === 'tab-liste') afficherPotager();
    if(tabId === 'tab-arrosage') genererListeArrosage();
    if(tabId === 'tab-planning') afficherPlanning();
    if(tabId === 'tab-sql') afficherTableauSQL();
    if(tabId === 'tab-pluie') afficherHistoriquePluie();
    document.getElementById('sidebar').classList.remove('open');
}

function save() { 
    localStorage.setItem("data_potager", JSON.stringify(monPotager)); 
    localStorage.setItem("data_pluie", JSON.stringify(pluviometrie)); 
}

function getPluie7Jours() {
    const sevenAgo = new Date(); sevenAgo.setDate(sevenAgo.getDate() - 7);
    return pluviometrie.filter(p => new Date(p.date) >= sevenAgo).reduce((sum, p) => sum + p.mm, 0);
}

function getStatutInfo(p) {
    return { text: "En cours", color: "violet" }; // Simplifié pour la structure
}

function getDelayInfo(arrosages) {
    if(!arrosages || arrosages.length === 0) return { label: "Jamais", class: "" };
    const diff = Math.floor((new Date() - new Date(arrosages[arrosages.length-1])) / 86400000);
    return { label: diff === 0 ? "Auj." : `Il y a ${diff} j.`, class: "" };
}

function afficherPotager() {
    const container = document.getElementById('affichageDonnees');
    container.innerHTML = "";
    const p7j = getPluie7Jours();
    monPotager.forEach(z => {
        let cards = "";
        z.rangs.forEach(r => r.plantes.forEach(p => {
            const delay = getDelayInfo(p.arrosages);
            const rain = (!p.abris && p7j > 0) ? ` <span style="color:var(--rain)">🌧️ ${p7j}mm</span>` : "";
            cards += `<div class="plante-card" onclick="editerDirect(${p.id})">
                <span class="status-badge st-violet">En cours</span>
                <strong>${p.nom}</strong><br><small>Zone ${z.nom} - R${r.numero} | 💧 ${delay.label}${rain}</small>
            </div>`;
        }));
        if(cards) container.innerHTML += `<div class="zone-box"><h2>ZONE ${z.nom}</h2>${cards}</div>`;
    });
}

function validerFormulaire() {
    const id = document.getElementById('edit-id').value ? parseInt(document.getElementById('edit-id').value) : Date.now();
    const p = {
        id: id,
        nom: document.getElementById('p_nom').value,
        zone: document.getElementById('p_zone').value || "A",
        rang: parseInt(document.getElementById('p_rang').value),
        abris: document.getElementById('p_abris').checked,
        date: document.getElementById('p_date').value,
        notes: document.getElementById('p_notes').value,
        arrosages: [],
        recolte: Array.from(document.querySelectorAll('input[name="mr"]:checked')).map(x => x.value)
    };

    // Nettoyage de l'ancien
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(x => x.id !== id)));
    
    // Rangement
    let z = monPotager.find(x => x.nom === p.zone);
    if(!z) { z = { nom: p.zone, rangs: [] }; monPotager.push(z); }
    let r = z.rangs.find(x => x.numero === p.rang);
    if(!r) { r = { numero: p.rang, plantes: [] }; z.rangs.push(r); }
    r.plantes.push(p);
    
    save();
    switchTab('tab-liste');
}

function editerDirect(id) {
    switchTab('tab-saisie');
    const p = monPotager.flatMap(z => z.rangs.flatMap(r => r.plantes)).find(x => x.id === id);
    if(p) {
        document.getElementById('edit-id').value = p.id;
        document.getElementById('p_nom').value = p.nom;
        document.getElementById('p_zone').value = p.zone;
        document.getElementById('p_rang').value = p.rang;
        document.getElementById('p_abris').checked = p.abris;
        document.getElementById('p_date').value = p.date;
        document.getElementById('p_notes').value = p.notes;
        document.getElementById('del-btn').style.display = "block";
        document.getElementById('dup-btn').style.display = "block";
    }
}

function supprimerFiche() {
    const id = parseInt(document.getElementById('edit-id').value);
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(x => x.id !== id)));
    save();
    switchTab('tab-liste');
}

function dupliquerFiche() {
    document.getElementById('edit-id').value = "";
    validerFormulaire();
}

function ouvrirAjout() {
    document.getElementById('pForm').reset();
    document.getElementById('edit-id').value = "";
    document.getElementById('del-btn').style.display = "none";
    document.getElementById('dup-btn').style.display = "none";
    switchTab('tab-saisie');
}

function ajouterPluie() {
    const date = document.getElementById('rain-date').value;
    const mm = parseFloat(document.getElementById('rain-mm').value);
    if(date && mm) {
        pluviometrie.push({date, mm});
        save();
        afficherHistoriquePluie();
    }
}

function afficherHistoriquePluie() {
    const container = document.getElementById('rain-history');
    container.innerHTML = pluviometrie.slice(-10).reverse().map(p => `
        <div class="rain-row"><span>${p.date}</span><span class="rain-badge">${p.mm} mm</span></div>
    `).join('');
}

function genererListeArrosage() {
    const container = document.getElementById('water-list');
    container.innerHTML = "";
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes.forEach(p => {
        container.innerHTML += `<div class="water-row"><input type="checkbox" value="${p.id}"> <span>${p.nom} (Z:${z.nom})</span></div>`;
    })));
}

function enregistrerArrosageBulk() {
    const date = document.getElementById('water-date').value;
    const ids = Array.from(document.querySelectorAll('#water-list input:checked')).map(x => parseInt(x.value));
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes.forEach(p => {
        if(ids.includes(p.id)) { if(!p.arrosages) p.arrosages = []; p.arrosages.push(date); }
    })));
    save();
    switchTab('tab-liste');
}

function afficherTableauSQL() {
    const head = document.getElementById('sql-head');
    const body = document.getElementById('sql-body');
    head.innerHTML = "<th>Zone</th><th>Rang</th><th>Nom</th><th>Date</th><th>Abris</th>";
    body.innerHTML = "";
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes.forEach(p => {
        body.innerHTML += `<tr><td>${z.nom}</td><td>${r.numero}</td><td>${p.nom}</td><td>${p.date}</td><td>${p.abris?'Oui':'Non'}</td></tr>`;
    })));
}

function afficherPlanning() {
    const head = document.getElementById('plan-head');
    const body = document.getElementById('plan-body');
    const p7j = getPluie7Jours();
    head.innerHTML = `<tr><th class="sticky-col">Plante</th>${MOIS_NOM.map(m => `<th>${m}</th>`).join('')}</tr>`;
    body.innerHTML = monPotager.flatMap(z => z.rangs.flatMap(r => r.plantes)).map(p => {
        const rain = (!p.abris && p7j > 0) ? `<br><small style="color:var(--rain)">🌧️${p7j}mm</small>` : "";
        return `<tr><td class="sticky-col">${p.nom}${rain}</td>${MOIS_NOM.map(m => `<td class="${p.recolte.includes(m)?'c-vert':''}"></td>`).join('')}</tr>`;
    }).join('');
}

function exportJSON() {
    const blob = new Blob([JSON.stringify(monPotager)], {type: "application/json"});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "potager.json"; a.click();
}

function importJSON(e) {
    const reader = new FileReader();
    reader.onload = (event) => { monPotager = JSON.parse(event.target.result); save(); afficherPotager(); };
    reader.readAsText(e.target.files[0]);
}

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
afficherPotager();
</script>
</body>
</html>
