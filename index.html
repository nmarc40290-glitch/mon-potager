<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Potager Pro - Status Dynamiques</title>
    <style>
        :root { 
            --primary: #2e7d32; --accent: #4caf50; --bg: #f4f9f4; --text: #2c3e50;
            --c-attente: #2196f3; /* Bleu : Semé mais pas levé */
            --c-croissance: #9c27b0; /* Violet : Levé / En croissance */
            --c-recolte: #1b5e20; /* Vert foncé : En production */
            --c-fini: #757575; /* Gris : Arraché */
            --c-prev: #ff9800; /* Orange : Prévisionnel */
        }
        
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: var(--text); }
        nav { background: var(--primary); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; flex-shrink: 0; }
        .nav-btns { display: flex; gap: 5px; }
        .nav-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8em; font-weight: bold; }
        .nav-btn.active { background: white; color: var(--primary); }

        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* PLANNING STICKY */
        #tab-planning { width: 100%; overflow: auto; background: white; position: relative; }
        .planning-table { border-collapse: collapse; table-layout: fixed; min-width: 1400px; }
        .planning-table th, .planning-table td { border: 1px solid #eee; padding: 6px 2px; text-align: center; font-size: 0.75em; height: 48px; }
        
        .col-nom { 
            width: 160px !important; position: sticky; left: 0; background: white !important; z-index: 20; 
            text-align: left !important; font-weight: bold; border-right: 2px solid var(--primary) !important; padding-left: 10px !important;
        }
        
        /* BARS */
        .bar { height: 10px; border-radius: 2px; width: 90%; margin: 1px auto; }
        .bg-attente { background-color: var(--c-attente); }
        .bg-croissance { background-color: var(--c-croissance); }
        .bg-recolte { background-color: var(--c-recolte); }
        .bg-fini { background-color: var(--c-fini); }
        .bg-prev { background-color: var(--c-prev); border: 1px dashed white; }

        /* LISTE */
        .zone-box { background: white; margin: 15px; border-radius: 10px; border-left: 6px solid var(--primary); padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .plante-card { background: #fff; border: 1px solid #eee; margin: 8px 0; padding: 12px; border-radius: 8px; cursor: pointer; }
        .status-badge { float: right; font-size: 0.65em; padding: 4px 8px; border-radius: 4px; color: white; font-weight: bold; }

        /* FORM */
        .section { display: none; padding: 15px; height: 100%; overflow-y: auto; }
        .section.active { display: block; }
        form { background: white; padding: 20px; border-radius: 12px; max-width: 500px; margin: 0 auto; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        label { display: block; margin: 10px 0 5px; font-weight: bold; font-size: 0.9em; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .mois-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: #f9f9f9; padding: 10px; border-radius: 8px; }
        .mois-item { display: flex; flex-direction: column; align-items: center; font-size: 0.7em; }

        .fab-add { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: white; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 35px; cursor: pointer; z-index: 1001; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<nav>
    <div style="font-weight:900;">🌿 MON POTAGER</div>
    <div class="nav-btns">
        <button class="nav-btn active" onclick="switchTab('tab-liste', this)">Liste</button>
        <button class="nav-btn" onclick="switchTab('tab-planning', this)">Planning</button>
    </div>
</nav>

<button class="fab-add" onclick="ouvrirAjout()">+</button>

<div class="main-container">
    <main class="content-area" style="width: 100%;">
        <!-- LISTE -->
        <div id="tab-liste" class="section active">
            <div id="affichageDonnees"></div>
        </div>

        <!-- PLANNING -->
        <div id="tab-planning" class="section" style="padding:0;">
            <table class="planning-table">
                <thead>
                    <tr id="p-years"></tr>
                    <tr id="p-months"></tr>
                </thead>
                <tbody id="p-body"></tbody>
            </table>
        </div>

        <!-- FORMULAIRE -->
        <div id="tab-saisie" class="section">
            <form id="pForm">
                <input type="hidden" id="edit-id">
                
                <label>Méthode de départ</label>
                <select id="p_init" onchange="toggleForm(this.value)">
                    <option value="semis">🌱 Semis (Graines)</option>
                    <option value="plant">🚜 Plant (Mise en terre directe)</option>
                </select>

                <label>Nom du légume</label>
                <input type="text" id="p_nom" placeholder="Ex: Tomate Coeur de Boeuf" required>

                <div style="display:flex; gap:10px;">
                    <div style="flex:1;"><label>Zone</label><input type="text" id="p_zone" placeholder="A, B, Serre..."></div>
                    <div style="flex:1;"><label>Rang</label><input type="number" id="p_rang" value="1"></div>
                </div>

                <label>Date de départ (Semis ou Plantation)</label>
                <input type="date" id="p_date_saisie" required>

                <div id="div_levee">
                    <label>Date de levée / Germination (Optionnel)</label>
                    <input type="date" id="p_date_levee">
                </div>

                <label>Date de 1ère récolte (Optionnel)</label>
                <input type="date" id="p_date_recolte">

                <label>Date d'arrachage / Fin (Optionnel)</label>
                <input type="date" id="p_date_fin">

                <label>Mois de récolte prévus (Orange)</label>
                <div class="mois-grid" id="moisGrid"></div>

                <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">
                    <button type="button" onclick="enregistrer()" style="background:var(--primary); color:white; padding:15px; border:none; border-radius:8px; font-weight:bold;">SAUVEGARDER</button>
                    <button type="button" id="btn-suppr" onclick="supprimer()" style="color:red; background:none; border:none; display:none;">Supprimer la fiche</button>
                    <button type="button" onclick="switchTab('tab-liste')" style="background:#eee; padding:10px; border:none; border-radius:8px;">Annuler</button>
                </div>
            </form>
        </div>
    </main>
</div>

<script>
let potager = JSON.parse(localStorage.getItem("db_potager_v2")) || [];
const MOIS = ["Jan", "Fév", "Mar", "Avr", "Mai", "Jui", "Jul", "Aoû", "Sep", "Oct", "Nov", "Déc"];

// --- INITIALISATION ---
const grid = document.getElementById('moisGrid');
MOIS.forEach(m => {
    grid.innerHTML += `<div class="mois-item"><input type="checkbox" name="m_prev" value="${m}"> ${m}</div>`;
});

function toggleForm(val) {
    document.getElementById('div_levee').style.display = (val === 'semis') ? 'block' : 'none';
}

function switchTab(id, btn) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(btn) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    if(id === 'tab-liste') majListe();
    if(id === 'tab-planning') majPlanning();
}

// --- CALCULATEUR DE STATUT (COEUR DU SYSTEME) ---
function getStatut(p) {
    if (p.dateFin) return { code: 'fini', label: 'ARR' };
    if (p.dateRecolte) return { code: 'recolte', label: 'RÉC' };
    if (p.typeInit === 'plant') return { code: 'croissance', label: 'CRO' };
    if (p.typeInit === 'semis') {
        return p.dateLevee ? { code: 'croissance', label: 'LEV' } : { code: 'attente', label: 'SEM' };
    }
    return { code: 'attente', label: '?' };
}

// --- LOGIQUE DONNÉES ---
function enregistrer() {
    const id = document.getElementById('edit-id').value || Date.now().toString();
    const nouvellePlante = {
        id,
        typeInit: document.getElementById('p_init').value,
        nom: document.getElementById('p_nom').value,
        zone: document.getElementById('p_zone').value.toUpperCase() || "A",
        rang: document.getElementById('p_rang').value,
        dateSaisie: document.getElementById('p_date_saisie').value,
        dateLevee: document.getElementById('p_date_levee').value,
        dateRecolte: document.getElementById('p_date_recolte').value,
        dateFin: document.getElementById('p_date_fin').value,
        prev: Array.from(document.querySelectorAll('input[name="m_prev"]:checked')).map(c => c.value)
    };

    potager = potager.filter(x => x.id !== id);
    potager.push(nouvellePlante);
    localStorage.setItem("db_potager_v2", JSON.stringify(potager));
    switchTab('tab-liste');
}

function majListe() {
    const cont = document.getElementById('affichageDonnees');
    cont.innerHTML = "";
    
    // Groupement par zone
    const zones = [...new Set(potager.map(p => p.zone))].sort();
    
    zones.forEach(z => {
        let html = `<div class="zone-box"><h3>ZONE ${z}</h3>`;
        potager.filter(p => p.zone === z).forEach(p => {
            const st = getStatut(p);
            html += `
                <div class="plante-card" onclick="ouvrirEdition('${p.id}')">
                    <span class="status-badge bg-${st.code}">${st.label}</span>
                    <strong>${p.nom}</strong><br>
                    <small>Départ: ${p.dateSaisie} | Rang: ${p.rang}</small>
                </div>`;
        });
        cont.innerHTML += html + `</div>`;
    });
}

function majPlanning() {
    const hY = document.getElementById('p-years');
    const hM = document.getElementById('p-months');
    const body = document.getElementById('p-body');
    const year = 2026;

    hY.innerHTML = `<th class="col-nom">Légume</th><th colspan="12">${year}</th>`;
    hM.innerHTML = `<th class="col-nom"></th>` + MOIS.map(m => `<th>${m}</th>`).join('');
    body.innerHTML = "";

    potager.sort((a,b) => a.nom.localeCompare(b.nom)).forEach(p => {
        const st = getStatut(p);
        let row = `<tr><td class="col-nom">${p.nom} <br><small>Z:${p.zone} R:${p.rang}</small></td>`;
        
        MOIS.forEach((m, idx) => {
            let content = "";
            // Barre de prévision (Orange)
            if(p.prev.includes(m)) content += `<div class="bar bg-prev"></div>`;
            
            // Barre de statut réel (si le mois correspond à l'état actuel ou passé)
            // Note : Pour simplifier le visuel, on affiche le statut sur les mois concernés
            const dS = new Date(p.dateSaisie);
            if(dS.getMonth() <= idx && !p.dateFin) {
                content += `<div class="bar bg-${st.code}"></div>`;
            } else if (p.dateFin && dS.getMonth() <= idx && new Date(p.dateFin).getMonth() >= idx) {
                content += `<div class="bar bg-${st.code}"></div>`;
            }

            row += `<td>${content}</td>`;
        });
        body.innerHTML += row + `</tr>`;
    });
}

function ouvrirAjout() {
    document.getElementById('pForm').reset();
    document.getElementById('edit-id').value = "";
    document.getElementById('btn-suppr').style.display = "none";
    switchTab('tab-saisie');
}

function ouvrirEdition(id) {
    const p = potager.find(x => x.id === id);
    document.getElementById('edit-id').value = p.id;
    document.getElementById('p_init').value = p.typeInit;
    document.getElementById('p_nom').value = p.nom;
    document.getElementById('p_zone').value = p.zone;
    document.getElementById('p_rang').value = p.rang;
    document.getElementById('p_date_saisie').value = p.dateSaisie;
    document.getElementById('p_date_levee').value = p.dateLevee;
    document.getElementById('p_date_recolte').value = p.dateRecolte;
    document.getElementById('p_date_fin').value = p.dateFin;
    
    document.querySelectorAll('input[name="m_prev"]').forEach(c => {
        c.checked = p.prev.includes(c.value);
    });
    
    document.getElementById('btn-suppr').style.display = "block";
    toggleForm(p.typeInit);
    switchTab('tab-saisie');
}

function supprimer() {
    if(confirm("Supprimer cette fiche ?")) {
        const id = document.getElementById('edit-id').value;
        potager = potager.filter(x => x.id !== id);
        localStorage.setItem("db_potager_v2", JSON.stringify(potager));
        switchTab('tab-liste');
    }
}

// Start
majListe();
</script>
</body>
</html>
