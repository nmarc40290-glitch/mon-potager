<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Potager Pro - Final</title>
    <style>
        :root { 
            --primary: #2e7d32; --primary-light: #e8f5e9; --accent: #4caf50; --danger: #d32f2f; 
            --bg: #f4f9f4; --text: #2c3e50;
            --c-semis: #2196f3; --c-planter: #ff9800; --c-recolte: #1b5e20; --c-prev: #a5d6a7;
        }
        
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: var(--text); }
        
        /* NAVIGATION */
        nav { background: var(--primary); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .nav-btns { display: flex; gap: 5px; }
        .nav-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8em; font-weight: bold; }
        .nav-btn.active { background: white; color: var(--primary); }

        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* SIDEBAR ACCORDEON */
        .sidebar { width: 260px; background: white; border-right: 1px solid #ddd; padding: 15px; overflow-y: auto; position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: 0.3s; z-index: 1100; box-shadow: 5px 0 15px rgba(0,0,0,0.1); }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header { font-size: 0.75em; font-weight: 900; color: #666; margin-top: 15px; padding: 10px; background: #f0f0f0; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; }
        .cat-content { display: block; }
        .cat-content.hidden { display: none; }
        .cat-link { display: block; padding: 10px 15px; color: #333; text-decoration: none; border-bottom: 1px solid #f9f9f9; cursor: pointer; font-size: 0.85em; }
        .cat-link:hover { background: var(--primary-light); }

        /* PLANNING TABLE */
        #tab-planning { width: 100%; overflow: auto; background: white; }
        .planning-table { border-collapse: collapse; table-layout: fixed; min-width: 800px; }
        .planning-table th, .planning-table td { border: 1px solid #eee; padding: 6px 2px; text-align: center; font-size: 0.75em; }
        .planning-table th { background: #f8f9fa; position: sticky; top: 0; z-index: 10; }
        .col-nom { width: 150px !important; position: sticky; left: 0; background: white; z-index: 11; text-align: left !important; font-weight: bold; border-right: 2px solid var(--primary) !important; padding-left: 10px !important; }
        .year-header { background: #333 !important; color: white !important; font-size: 1em !important; }
        
        /* BARRES DANS PLANNING */
        .bar { height: 10px; border-radius: 2px; width: 85%; margin: 1px auto; }
        .bg-reel { background-color: var(--c-semis); }
        .bg-recolte-reel { background-color: var(--c-recolte); }
        .bg-prev { background: repeating-linear-gradient(45deg, var(--c-prev), var(--c-prev) 4px, #fff 4px, #fff 8px); border: 1px solid var(--c-prev); }
        .current-month-cell { background: #fff5f5; border: 1px solid var(--danger) !important; }

        /* LISTE & CARTES */
        .content-area { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .section { display: none; padding: 15px; }
        .section.active { display: block; }
        .zone-box { background: white; margin-bottom: 20px; border-radius: 10px; border-left: 6px solid var(--primary); padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .plante-card { background: #fff; border: 1px solid #eee; margin: 8px 0; padding: 12px; border-radius: 8px; cursor: pointer; position: relative; }
        .status-badge { float: right; font-size: 0.6em; padding: 3px 6px; border-radius: 4px; color: white; font-weight: bold; text-transform: uppercase; }
        .st-semis { background: var(--c-semis); }
        .st-sortis { background: #9c27b0; }
        .st-recolte { background: var(--c-recolte); }
        .st-arracher { background: #757575; }

        /* FORMULAIRE */
        form { background: white; padding: 20px; border-radius: 12px; max-width: 500px; margin: 0 auto; }
        label { display: block; margin: 12px 0 4px; font-weight: bold; font-size: 0.9em; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .mois-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; background: #f1f1f1; padding: 10px; border-radius: 8px; }
        
        .fab-add { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: white; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1001; }
    </style>
</head>
<body>

<nav>
    <div onclick="toggleSidebar()" style="cursor:pointer; display:flex; align-items:center; gap:10px;">
        <span>☰</span> <span style="font-weight:900">MON POTAGER</span>
    </div>
    <div class="nav-btns">
        <button class="nav-btn active" id="btn-list" onclick="switchTab('tab-liste')">Liste</button>
        <button class="nav-btn" id="btn-plan" onclick="switchTab('tab-planning')">Planning</button>
    </div>
</nav>

<button id="add-btn" class="fab-add" onclick="ouvrirAjout()">+</button>

<div class="main-container">
    <aside id="sidebar" class="sidebar">
        <div style="font-weight:bold; color:var(--primary); margin-bottom:10px;">MENU</div>
        <a class="cat-link" style="font-weight:bold; background:var(--primary-light)" onclick="filtrer('tout', null)">📋 TOUT AFFICHER</a>
        
        <div id="sidebar-content"></div>

        <div style="margin-top:20px; border-top:1px solid #eee; padding-top:15px;">
            <button style="width:100%; padding:8px; margin-bottom:5px;" onclick="exporterDonnees()">📥 Export JSON</button>
            <button style="width:100%; padding:8px;" onclick="document.getElementById('fImport').click()">📤 Import</button>
            <input type="file" id="fImport" style="display:none" onchange="importerDonnees(event)">
        </div>
    </aside>

    <main class="content-area">
        <div id="tab-liste" class="section active"><div id="affichageDonnees"></div></div>
        
        <div id="tab-planning" class="section" style="padding:0;">
            <table class="planning-table" id="pTable">
                <thead>
                    <tr id="p-years"></tr>
                    <tr id="p-months"></tr>
                </thead>
                <tbody id="p-body"></tbody>
            </table>
        </div>

        <div id="tab-saisie" class="section">
            <form id="pForm">
                <input type="hidden" id="edit-id">
                
                <div id="creation-status-div">
                    <label>Mode de démarrage</label>
                    <select id="p_init" onchange="toggleLeveeField(this.value)">
                        <option value="semis">🌱 Semis (Graine)</option>
                        <option value="planter">🚜 Plantation (Plant)</option>
                    </select>
                </div>

                <label>Nom du légume</label>
                <input type="text" id="p_nom" required list="noms-existants">
                <datalist id="noms-existants"></datalist>

                <div style="display:flex; gap:10px;">
                    <div style="flex:1;"><label>Zone</label><input type="text" id="p_zone" placeholder="Ex: A"></div>
                    <div style="flex:1;"><label>Rang</label><select id="p_rang"></select></div>
                </div>

                <div id="field-levee" style="display:none;">
                    <label>Date de levée (réelle)</label>
                    <input type="date" id="p_date_levee">
                </div>

                <label id="lbl_date_main">Date de mise en terre</label>
                <input type="date" id="p_date">

                <label>Début récolte (réel)</label>
                <input type="date" id="p_date_recolte">

                <label>Récoltes prévues (Projection)</label>
                <div class="mois-grid" id="moisGrid"></div>

                <label>Date d'arrachage / fin</label>
                <input type="date" id="p_date_fin">

                <button type="button" onclick="validerFormulaire()" style="background:var(--primary); color:white; width:100%; border:none; padding:15px; border-radius:8px; font-weight:bold; margin-top:20px;">ENREGISTRER</button>
                <button type="button" id="dup-btn" style="background:var(--c-semis); color:white; width:100%; border:none; padding:12px; border-radius:8px; margin-top:10px; display:none;" onclick="dupliquerPlante()">DUPLIQUER CETTE FICHE</button>
                <button type="button" id="del-btn" style="width:100%; color:red; border:none; background:none; margin-top:10px;" onclick="supprimerViaForm()">Supprimer</button>
            </form>
        </div>
    </main>
</div>

<script>
let monPotager = JSON.parse(localStorage.getItem("data_potager")) || [];
let filtreActuel = { type: 'tout', valeur: null };
const MOIS_NOM = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Juil", "Août", "Sept", "Oct", "Nov", "Déc"];
const NOW = new Date();

// Initialisation Formulaire
for(let i=1; i<=30; i++) { 
    let o = document.createElement('option'); o.value = i; o.innerText = "Rang " + i; 
    document.getElementById('p_rang').appendChild(o); 
}
MOIS_NOM.forEach(m => {
    document.getElementById('moisGrid').innerHTML += `<label style="display:flex;align-items:center;gap:5px;font-size:0.8em"><input type="checkbox" name="mr" value="${m}"> ${m}</label>`;
});

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

function toggleSection(id) {
    const content = document.getElementById(id);
    const arrow = document.getElementById('arrow-' + id);
    content.classList.toggle('hidden');
    arrow.innerText = content.classList.contains('hidden') ? '►' : '▼';
}

function toggleLeveeField(val) {
    document.getElementById('field-levee').style.display = (val === 'semis') ? 'block' : 'none';
    document.getElementById('lbl_date_main').innerText = (val === 'semis') ? "Date du semis" : "Date de plantation";
}

function switchTab(tabId) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    document.getElementById('sidebar').classList.remove('open');
    if(tabId === 'tab-liste') { document.getElementById('btn-list').classList.add('active'); updateSidebar(); afficherPotager(); }
    if(tabId === 'tab-planning') { document.getElementById('btn-plan').classList.add('active'); genererPlanning(); }
    document.getElementById('add-btn').style.display = (tabId === 'tab-saisie') ? 'none' : 'flex';
}

function updateSidebar() {
    const data = { zones: new Set(), plantes: new Set() };
    monPotager.forEach(z => { data.zones.add(z.nom); z.rangs.forEach(r => r.plantes.forEach(p => data.plantes.add(p.nom))); });
    
    const container = document.getElementById('sidebar-content'); container.innerHTML = "";
    const dl = document.getElementById('noms-existants'); dl.innerHTML = "";
    Array.from(data.plantes).sort().forEach(n => dl.innerHTML += `<option value="${n}">`);

    const build = (titre, items, type, id) => {
        let html = `<div class="sidebar-header" onclick="toggleSection('${id}')"><span>${titre}</span> <span id="arrow-${id}">▼</span></div><div id="${id}" class="cat-content">`;
        Array.from(items).sort().forEach(v => html += `<a class="cat-link" onclick="filtrer('${type}', '${v}')">${v}</a>`);
        container.innerHTML += html + `</div>`;
    };
    build("PAR ZONE", data.zones, 'zone', 'side-z');
    build("PAR LÉGUME", data.plantes, 'nom', 'side-l');
}

function genererPlanning() {
    let minYear = NOW.getFullYear();
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes.forEach(p => { if(p.date) { let y = new Date(p.date).getFullYear(); if(y < minYear) minYear = y; } })));
    let maxYear = NOW.getFullYear() + 1;

    const hY = document.getElementById('p-years'); const hM = document.getElementById('p-months'); const body = document.getElementById('p-body');
    hY.innerHTML = '<th class="col-nom"></th>'; hM.innerHTML = '<th class="col-nom">Légume</th>'; body.innerHTML = "";

    for(let y = minYear; y <= maxYear; y++) {
        hY.innerHTML += `<th colspan="12" class="year-header">${y}</th>`;
        MOIS_NOM.forEach((m, i) => {
            let isCurr = (y === NOW.getFullYear() && i === NOW.getMonth());
            hM.innerHTML += `<th class="${isCurr ? 'current-month-cell' : ''}">${m}</th>`;
        });
    }

    let flat = []; monPotager.forEach(z => z.rangs.forEach(r => r.plantes.forEach(p => flat.push({...p, zone:z.nom}))));
    flat.sort((a,b) => a.nom.localeCompare(b.nom)).forEach(p => {
        let row = `<tr><td class="col-nom">${p.nom} <small>(Z:${p.zone})</small></td>`;
        for(let y = minYear; y <= maxYear; y++) {
            MOIS_NOM.forEach((m, mi) => {
                const cellStart = new Date(y, mi, 1);
                const cellEnd = new Date(y, mi + 1, 0);
                const isCurr = (y === NOW.getFullYear() && mi === NOW.getMonth());
                const isFuture = cellStart > new Date(NOW.getFullYear(), NOW.getMonth(), 31);
                
                const dS = p.date ? new Date(p.date) : null;
                const dR = p.dateRecolte ? new Date(p.dateRecolte) : null;
                const dF = (p.dateFin && p.dateFin !== "Non définie") ? new Date(p.dateFin) : null;
                const isPrev = p.recolte && p.recolte.includes(m) && y >= NOW.getFullYear();

                let bars = "";
                if (cellEnd >= dS && (!dF || cellStart <= dF)) {
                    if (dR && cellEnd >= dR) bars += `<div class="bar bg-recolte-reel"></div>`;
                    else if (dS && !isFuture) bars += `<div class="bar bg-reel"></div>`;
                }
                if ((isCurr || isFuture) && isPrev) bars += `<div class="bar bg-prev"></div>`;
                row += `<td class="${isCurr ? 'current-month-cell' : ''}">${bars}</td>`;
            });
        }
        body.innerHTML += row + "</tr>";
    });
}

function filtrer(type, val) { filtreActuel = { type, valeur: val }; toggleSidebar(); afficherPotager(); }

function afficherPotager() {
    const container = document.getElementById('affichageDonnees'); container.innerHTML = "";
    monPotager.forEach((zone, zIdx) => {
        let cards = "";
        zone.rangs.forEach((rang, rIdx) => {
            rang.plantes.forEach((p, pIdx) => {
                if (filtreActuel.type === 'tout' || (filtreActuel.type === 'nom' && filtreActuel.valeur === p.nom) || (filtreActuel.type === 'zone' && filtreActuel.valeur === zone.nom)) {
                    let st = p.dateRecolte ? 'recolte' : (p.dateLevee ? 'sortis' : 'semis');
                    if(p.dateFin && p.dateFin !== "Non définie") st = 'arracher';
                    cards += `<div class="plante-card" onclick="preparerEdition(${zIdx},${rIdx},${pIdx})"><span class="status-badge st-${st}">${st}</span><strong>${p.nom}</strong><br><small>Zone ${zone.nom} - Rang ${rang.numero}</small></div>`;
                }
            });
        });
        if(cards) container.innerHTML += `<div class="zone-box"><h3>ZONE ${zone.nom}</h3>${cards}</div>`;
    });
}

function ouvrirAjout() {
    document.getElementById('pForm').reset(); document.getElementById('edit-id').value = "";
    document.getElementById('creation-status-div').style.display = 'block';
    document.getElementById('dup-btn').style.display = 'none'; document.getElementById('del-btn').style.display = 'none';
    toggleLeveeField('semis'); switchTab('tab-saisie');
}

function preparerEdition(zi, ri, pi) {
    const p = monPotager[zi].rangs[ri].plantes[pi]; ouvrirAjout();
    document.getElementById('edit-id').value = p.id; document.getElementById('p_nom').value = p.nom;
    document.getElementById('p_zone').value = monPotager[zi].nom; document.getElementById('p_rang').value = monPotager[zi].rangs[ri].numero;
    document.getElementById('p_date').value = p.date || ""; document.getElementById('p_date_levee').value = p.dateLevee || "";
    document.getElementById('p_date_recolte').value = p.dateRecolte || ""; document.getElementById('p_date_fin').value = p.dateFin === "Non définie" ? "" : p.dateFin;
    document.getElementById('creation-status-div').style.display = 'none';
    document.getElementById('dup-btn').style.display = 'block'; document.getElementById('del-btn').style.display = 'block';
    document.querySelectorAll('input[name="mr"]').forEach(cb => cb.checked = p.recolte.includes(cb.value));
}

function validerFormulaire() {
    const nom = document.getElementById('p_nom').value; if(!nom) return;
    const p = {
        id: document.getElementById('edit-id').value ? parseInt(document.getElementById('edit-id').value) : Date.now(),
        nom, date: document.getElementById('p_date').value, dateLevee: document.getElementById('p_date_levee').value,
        dateRecolte: document.getElementById('p_date_recolte').value, dateFin: document.getElementById('p_date_fin').value || "Non définie",
        recolte: Array.from(document.querySelectorAll('input[name="mr"]:checked')).map(cb => cb.value)
    };
    const zN = document.getElementById('p_zone').value.toUpperCase() || "A"; const rN = document.getElementById('p_rang').value;
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(x => x.id !== p.id)));
    let z = monPotager.find(x => x.nom === zN); if(!z){z={nom:zN, rangs:[]}; monPotager.push(z);}
    let r = z.rangs.find(x => x.numero === rN); if(!r){r={numero:rN, plantes:[]}; z.rangs.push(r);}
    r.plantes.push(p); localStorage.setItem("data_potager", JSON.stringify(monPotager)); switchTab('tab-liste');
}

function dupliquerPlante() { document.getElementById('edit-id').value = ""; validerFormulaire(); }
function supprimerViaForm() { if(confirm("Supprimer ?")) { const id = parseInt(document.getElementById('edit-id').value); monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(p => p.id !== id))); localStorage.setItem("data_potager", JSON.stringify(monPotager)); switchTab('tab-liste'); } }
function exporterDonnees() { const blob = new Blob([JSON.stringify(monPotager)], {type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="potager.json"; a.click(); }
function importerDonnees(e) { const reader = new FileReader(); reader.onload=(ex)=>{ monPotager=JSON.parse(ex.target.result); localStorage.setItem("data_potager", JSON.stringify(monPotager)); location.reload(); }; reader.readAsText(e.target.files[0]); }

updateSidebar(); afficherPotager();
</script>
</body>
</html>
