<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Potager Automatisé</title>
  <style>
    :root { 
      --primary: #2e7d32; --primary-dark: #1b5e20; --primary-light: #f1f8e9; 
      --accent: #8bc34a; --danger: #ef5350; --bg: #fafdfa; --text: #2c3e50;
      --radius: 12px; --shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    nav { background: var(--primary-dark); color: white; padding: 18px; text-align: center; font-weight: 700; text-transform: uppercase; z-index: 1000; }
    
    .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
    .content-area { flex: 1; overflow-y: auto; padding: 20px; }
    .section { display: none; max-width: 700px; margin: 0 auto; }
    .section.active { display: block; }

    /* FORMULAIRE */
    form { background: white; padding: 25px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 80px; }
    label { font-weight: 700; display: block; margin-top: 15px; margin-bottom: 5px; font-size: 0.9em; }
    input, select { width: 100%; padding: 12px; border: 2px solid #edf2f7; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    
    .row { display: flex; gap: 15px; margin-bottom: 10px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 140px; }

    /* STATUTS */
    .status-selector { display: flex; gap: 10px; margin-bottom: 20px; }
    .status-opt { flex: 1; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; border: 2px solid #edf2f7; font-weight: 600; transition: 0.2s; }
    .status-opt.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* GRILLE MOIS */
    .mois-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; }
    .mois-item { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9em; }
    .mois-item input { width: 18px; height: 18px; accent-color: var(--primary); }

    /* BADGES LISTE */
    .plante-card { background: white; border: 1px solid #f0f4f8; margin: 10px 0; padding: 15px; border-radius: var(--radius); cursor: pointer; transition: 0.2s; position: relative; }
    .status-badge { float: right; font-size: 0.7em; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; font-weight: 800; }
    .st-semis { background: #e3f2fd; color: #1565c0; }
    .st-sortis { background: #f1f8e9; color: #33691e; }
    .st-planter { background: #fff3e0; color: #e65100; }
    .st-recolte { background: #e8f5e9; color: #2e7d32; border: 1px solid #2e7d32; animation: pulse 2s infinite; }
    .st-arracher { background: #f1f5f9; color: #94a3b8; text-decoration: line-through; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

    .btn-save { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 10px; width: 100%; cursor: pointer; font-weight: 700; margin-top: 25px; font-size: 1.1em; }
    .fab { position: fixed; bottom: 25px; right: 25px; background: var(--accent); color: white; border: none; border-radius: 50%; width: 64px; height: 64px; font-size: 32px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
  </style>
</head>
<body>

<nav>Mon Potager</nav>

<button id="add-btn" class="fab" onclick="ouvrirAjout()">+</button>

<div class="main-container">
  <main class="content-area">
    <div id="tab-liste" class="section active"><div id="affichageDonnees"></div></div>

    <div id="tab-saisie" class="section">
      <form id="potagerForm">
        <input type="hidden" id="edit-id">
        
        <div id="creation-only">
            <label>Action initiale *</label>
            <div class="status-selector">
                <div class="status-opt" data-val="semis" onclick="selectStatus(this)">🌱 Semis</div>
                <div class="status-opt" data-val="planter" onclick="selectStatus(this)">🚜 Plantation</div>
            </div>
        </div>

        <label>Variété</label>
        <input type="text" id="p_nom" required placeholder="Ex: Courgette Verte">
        
        <div class="row">
          <div class="col"><label>Zone</label><input type="text" id="p_zone" placeholder="Ex: A"></div>
          <div class="col"><label>Rang</label><select id="p_rang"></select></div>
        </div>

        <label>Suivi des dates</label>
        <div class="row">
          <div class="col"><label>Date début</label><input type="date" id="p_date"></div>
          <div class="col" id="col-levee"><label>Date de levée</label><input type="date" id="p_date_levee"></div>
        </div>
        <div class="row">
          <div class="col"><label>Début Récolte</label><input type="date" id="p_date_recolte"></div>
          <div class="col"><label>Date Arrachage</label><input type="date" id="p_date_fin"></div>
        </div>

        <label>Mois de récolte prévus</label>
        <div id="moisGrid" class="mois-grid"></div>

        <button type="button" class="btn-save" onclick="validerFormulaire()">ENREGISTRER</button>
        <button type="button" style="width:100%; margin-top:10px; border:none; background:none; color:#94a3b8; cursor:pointer;" onclick="switchTab('tab-liste')">ANNULER</button>
      </form>
    </div>
  </main>
</div>

<script>
let monPotager = JSON.parse(localStorage.getItem("data_potager")) || [];
let selectedStatusVal = null;
const MOIS_LISTE = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Juil", "Août", "Sept", "Oct", "Nov", "Déc"];

// Init
for(let i=1; i<=30; i++) { document.getElementById('p_rang').innerHTML += `<option value="${i}">${i}</option>`; }
MOIS_LISTE.forEach(m => { document.getElementById('moisGrid').innerHTML += `<label class="mois-item"><input type="checkbox" name="mr" value="${m}"><span>${m}</span></label>`; });

function selectStatus(el) {
    document.querySelectorAll('.status-opt').forEach(opt => opt.classList.remove('active'));
    el.classList.add('active');
    selectedStatusVal = el.getAttribute('data-val');
    document.getElementById('col-levee').style.opacity = (selectedStatusVal === 'semis') ? "1" : "0.3";
}

function switchTab(tabId) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if(tabId === 'tab-liste') afficherPotager();
}

function ouvrirAjout() {
    document.getElementById('potagerForm').reset();
    document.getElementById('edit-id').value = "";
    document.getElementById('creation-only').style.display = "block";
    selectedStatusVal = null;
    document.querySelectorAll('.status-opt').forEach(opt => opt.classList.remove('active'));
    switchTab('tab-saisie');
}

function afficherPotager() {
    const container = document.getElementById('affichageDonnees'); container.innerHTML = "";
    monPotager.forEach((zone, zIdx) => {
        let cards = "";
        zone.rangs.forEach((rang, rIdx) => {
            rang.plantes.forEach((p, pIdx) => {
                // LOGIQUE DE STATUT AUTOMATIQUE POUR L'AFFICHAGE
                let currentStatus = p.status; // Base (semis ou planter)
                if(p.dateLevee) currentStatus = 'sortis';
                if(p.dateRecolte) currentStatus = 'recolte';
                if(p.dateFin) currentStatus = 'arracher';

                const label = {semis:'Semis', sortis:'Levé', planter:'Planté', recolte:'Récolte en cours', arracher:'Arraché'}[currentStatus];
                
                cards += `<div class="plante-card" onclick="preparerEdition(${zIdx},${rIdx},${pIdx})">
                    <span class="status-badge st-${currentStatus}">${label}</span>
                    <div style="font-weight:700;">${p.nom}</div>
                    <div style="font-size:0.8em; color:#64748b;">Zone ${zone.nom} • Rang ${rang.numero}</div>
                </div>`;
            });
        });
        if(cards) container.innerHTML += `<div style="margin-bottom:20px;"><div style="font-weight:800; font-size:0.8em; color:var(--primary); text-transform:uppercase; margin-bottom:10px;">Parcelle ${zone.nom}</div>${cards}</div>`;
    });
}

function preparerEdition(zIdx, rIdx, pIdx) {
    const p = monPotager[zIdx].rangs[rIdx].plantes[pIdx];
    ouvrirAjout();
    document.getElementById('edit-id').value = p.id;
    document.getElementById('creation-only').style.display = "none"; // MASQUÉ EN ÉDITION
    document.getElementById('p_nom').value = p.nom;
    document.getElementById('p_zone').value = monPotager[zIdx].nom;
    document.getElementById('p_rang').value = monPotager[zIdx].rangs[rIdx].numero;
    document.getElementById('p_date').value = p.date || "";
    document.getElementById('p_date_levee').value = p.dateLevee || "";
    document.getElementById('p_date_recolte').value = p.dateRecolte || "";
    document.getElementById('p_date_fin').value = p.dateFin || "";
    selectedStatusVal = p.status; // On garde le statut d'origine en mémoire
    switchTab('tab-saisie');
}

function validerFormulaire() {
    const nom = document.getElementById('p_nom').value;
    const isEdit = document.getElementById('edit-id').value !== "";
    if(!nom || (!isEdit && !selectedStatusVal)) return alert("Nom et Statut requis");

    const p = {
        id: parseInt(document.getElementById('edit-id').value) || Date.now(),
        nom: nom,
        status: selectedStatusVal, // Semis ou Planter (choisi à la création)
        date: document.getElementById('p_date').value,
        dateLevee: document.getElementById('p_date_levee').value,
        dateRecolte: document.getElementById('p_date_recolte').value,
        dateFin: document.getElementById('p_date_fin').value,
        recolte: Array.from(document.querySelectorAll('input[name="mr"]:checked')).map(cb => cb.value)
    };

    const zN = document.getElementById('p_zone').value.toUpperCase() || "A", rN = document.getElementById('p_rang').value;
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(x => x.id !== p.id)));
    let z = monPotager.find(x => x.nom === zN); if(!z) { z = {nom:zN, rangs:[]}; monPotager.push(z); }
    let r = z.rangs.find(x => x.numero === rN); if(!r) { r = {numero:rN, plantes:[]}; z.rangs.push(r); }
    r.plantes.push(p);
    localStorage.setItem("data_potager", JSON.stringify(monPotager));
    switchTab('tab-liste');
}

afficherPotager();
</script>
</body>
</html>
