<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potager Fix Final</title>
    <style>
        :root { 
            --primary: #2e7d32; --accent: #4caf50; --bg: #f4f9f4; 
            --c-sous-terre: #2196f3; --c-attente: #9c27b0; --c-recolte: #1b5e20;
            --c-fini: #757575; --c-prev: #ff9800;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        nav { background: var(--primary); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 100; }
        .nav-btns { display: flex; gap: 5px; }
        .nav-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 5px; font-weight: bold; }
        .nav-btn.active { background: white; color: var(--primary); }

        .main-container { flex: 1; position: relative; overflow: hidden; display: flex; }

        /* --- LE PLANNING (CORRECTION STICKY) --- */
        #tab-planning { 
            display: none; 
            width: 100%; 
            height: 100%; 
            overflow: auto; /* Permet le scroll horizontal et vertical */
        }
        #tab-planning.active { display: block; }

        .planning-table { border-collapse: separate; border-spacing: 0; min-width: 1600px; }
        .planning-table th, .planning-table td { 
            border: 0.5px solid #eee; 
            padding: 4px; 
            text-align: center; 
            height: 45px; 
            min-width: 40px;
            position: relative;
        }

        /* FIXE LA COLONNE NOM */
        .col-nom { 
            position: sticky !important; 
            left: 0 !important; 
            z-index: 10 !important; 
            background: white !important; 
            width: 150px !important; 
            min-width: 150px !important;
            border-right: 2px solid var(--primary) !important;
            text-align: left !important;
            padding-left: 10px !important;
        }
        thead th.col-nom { z-index: 20 !important; top: 0; }

        /* Barres */
        .bar-container { display: flex; flex-direction: column; gap: 2px; width: 100%; }
        .bar { height: 8px; border-radius: 2px; width: 100%; }
        .bg-bleu { background: var(--c-sous-terre); }
        .bg-violet { background: var(--c-attente); }
        .bg-vert { background: var(--c-recolte); }
        .bg-gris { background: var(--c-fini); }
        .bg-prev { background: var(--c-prev); }

        /* Autres styles */
        .section { display: none; padding: 15px; overflow-y: auto; height: 100%; box-sizing: border-box; }
        .section.active { display: block; }
        .fab-add { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: white; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 30px; z-index: 200; }
        .zone-box { background: white; margin-bottom: 15px; border-radius: 8px; border-left: 5px solid var(--primary); padding: 10px; }
        .plante-card { border: 1px solid #eee; margin: 5px 0; padding: 10px; border-radius: 5px; background: #fff; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        .mois-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; background: #eee; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<nav>
    <div style="font-weight:bold;">MON POTAGER</div>
    <div class="nav-btns">
        <button class="nav-btn active" id="btn-list" onclick="switchTab('tab-liste')">Liste</button>
        <button class="nav-btn" id="btn-plan" onclick="switchTab('tab-planning')">Planning</button>
    </div>
</nav>

<button class="fab-add" onclick="ouvrirAjout()">+</button>

<div class="main-container">
    <div id="tab-liste" class="section active"></div>
    
    <div id="tab-planning">
        <table class="planning-table">
            <thead>
                <tr id="p-years"></tr>
                <tr id="p-months"></tr>
            </thead>
            <tbody id="p-body"></tbody>
        </table>
    </div>

    <div id="tab-saisie" class="section">
        <form id="pForm">
            <input type="hidden" id="edit-id">
            <select id="p_init" onchange="toggleLeveeField(this.value)">
                <option value="semis">🌱 Semis</option>
                <option value="planter">🚜 Plantation</option>
            </select>
            <input type="text" id="p_nom" placeholder="Nom du légume" required>
            <input type="text" id="p_zone" placeholder="Zone (ex: A)">
            <select id="p_rang"></select>
            <div id="field-levee" style="display:none"><label>Date Levée</label><input type="date" id="p_date_levee"></div>
            <label id="lbl_date_main">Date Semis</label><input type="date" id="p_date">
            <label>Date Début Récolte</label><input type="date" id="p_date_recolte">
            <label>Mois de récolte prévus</label>
            <div class="mois-grid" id="moisGrid"></div>
            <label>Date Arrachage</label><input type="date" id="p_date_fin">
            <button type="button" onclick="validerFormulaire()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; margin-top:10px;">ENREGISTRER</button>
            <button type="button" onclick="switchTab('tab-liste')" style="width:100%; padding:10px; background:#ccc; border:none; margin-top:5px;">ANNULER</button>
        </form>
    </div>
</div>

<script>
let monPotager = JSON.parse(localStorage.getItem("data_potager")) || [];
const MOIS_NOM = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Juil", "Août", "Sept", "Oct", "Nov", "Déc"];
const TODAY = new Date();

// Init Form
for(let i=1; i<=30; i++) { 
    let o = document.createElement('option'); o.value = i; o.innerText = "Rang " + i; 
    document.getElementById('p_rang').appendChild(o); 
}
document.getElementById('moisGrid').innerHTML = MOIS_NOM.map(m => `<div><input type="checkbox" name="mr" value="${m}"> ${m}</div>`).join('');

function switchTab(id) {
    document.querySelectorAll('.section, #tab-planning').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 'tab-liste') { document.getElementById('btn-list').classList.add('active'); afficherListe(); }
    if(id === 'tab-planning') { document.getElementById('btn-plan').classList.add('active'); genererPlanning(); }
}

function getStatutInfo(p, dateRef = TODAY) {
    const dS = p.date ? new Date(p.date) : null;
    const dL = p.dateLevee ? new Date(p.dateLevee) : null;
    const dR = p.dateRecolte ? new Date(p.dateRecolte) : null;
    const dF = (p.dateFin && p.dateFin !== "Non définie") ? new Date(p.dateFin) : null;
    if (dF && dateRef >= dF) return { color: "gris" };
    if (dR && dateRef >= dR) return { color: "vert" };
    if (p.typeInit === 'semis') {
        if (dL && dateRef >= dL) return { color: "violet" };
        if (dS && dateRef >= dS) return { color: "bleu" };
    } else {
        if (dS && dateRef >= dS) return { color: "violet" };
    }
    return null;
}

function genererPlanning() {
    const hY = document.getElementById('p-years'), hM = document.getElementById('p-months'), body = document.getElementById('p-body');
    hY.innerHTML = hM.innerHTML = '<th class="col-nom">Légume</th>';
    
    for(let y=2025; y<=2026; y++) {
        hY.innerHTML += `<th colspan="12" style="background:#333; color:white">${y}</th>`;
        MOIS_NOM.forEach(m => hM.innerHTML += `<th>${m}</th>`);
    }

    body.innerHTML = "";
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes.forEach(p => {
        let row = `<tr><td class="col-nom"><b>${p.nom}</b><br><small>Z:${z.nom} R:${r.numero}</small></td>`;
        const dS = p.date ? new Date(p.date) : null;
        const dF = (p.dateFin && p.dateFin !== "Non définie") ? new Date(p.dateFin) : null;

        for(let y=2025; y<=2026; y++) {
            MOIS_NOM.forEach((m, mi) => {
                const dMoisDeb = new Date(y, mi, 1);
                const dMoisFin = new Date(y, mi + 1, 0);
                let bars = [];
                
                if (dS) {
                    // Prévision : Seulement SI le mois de la cellule est >= au mois de plantation
                    if (p.recolte && p.recolte.includes(m) && dMoisFin >= dS) {
                        bars.push("bg-prev");
                    }
                    
                    // Réel (jusqu'à aujourd'hui)
                    if (dMoisDeb <= TODAY && dS <= dMoisFin) {
                        const st = getStatutInfo(p, dMoisFin);
                        if (st) {
                             if (st.color === 'gris') {
                                 if (dF && dF >= dMoisDeb && dF <= dMoisFin) bars.push("bg-gris");
                             } else {
                                 bars.push("bg-" + st.color);
                             }
                        }
                    }
                }
                
                row += `<td><div class="bar-container">${[...new Set(bars)].map(b => `<div class="bar ${b}"></div>`).join('')}</div></td>`;
            });
        }
        body.innerHTML += row + "</tr>";
    })));
}

function afficherListe() {
    const cont = document.getElementById('tab-liste'); cont.innerHTML = "";
    monPotager.forEach((z, zi) => {
        let cards = "";
        z.rangs.forEach((r, ri) => r.plantes.forEach((p, pi) => {
            cards += `<div class="plante-card" onclick="edit(${zi},${ri},${pi})"><strong>${p.nom}</strong> - Zone ${z.nom}</div>`;
        }));
        if(cards) cont.innerHTML += `<div class="zone-box"><h3>Zone ${z.nom}</h3>${cards}</div>`;
    });
}

function validerFormulaire() {
    const id = document.getElementById('edit-id').value || Date.now();
    const p = {
        id: parseInt(id), nom: document.getElementById('p_nom').value,
        typeInit: document.getElementById('p_init').value,
        date: document.getElementById('p_date').value,
        dateLevee: document.getElementById('p_date_levee').value,
        dateRecolte: document.getElementById('p_date_recolte').value,
        dateFin: document.getElementById('p_date_fin').value || "",
        recolte: Array.from(document.querySelectorAll('input[name="mr"]:checked')).map(c => c.value)
    };
    const zN = (document.getElementById('p_zone').value || "A").toUpperCase();
    const rN = document.getElementById('p_rang').value;
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(x => x.id !== p.id)));
    let z = monPotager.find(x => x.nom === zN); if(!z) { z = {nom:zN, rangs:[]}; monPotager.push(z); }
    let r = z.rangs.find(x => x.numero === rN); if(!r) { r = {numero:rN, plantes:[]}; z.rangs.push(r); }
    r.plantes.push(p);
    localStorage.setItem("data_potager", JSON.stringify(monPotager));
    switchTab('tab-liste');
}

function edit(zi, ri, pi) {
    const p = monPotager[zi].rangs[ri].plantes[pi];
    ouvrirAjout();
    document.getElementById('edit-id').value = p.id;
    document.getElementById('p_nom').value = p.nom;
    document.getElementById('p_zone').value = monPotager[zi].nom;
    document.getElementById('p_rang').value = monPotager[zi].rangs[ri].numero;
    document.getElementById('p_date').value = p.date;
    document.getElementById('p_date_levee').value = p.dateLevee;
    document.getElementById('p_date_recolte').value = p.dateRecolte;
    document.getElementById('p_date_fin').value = p.dateFin;
    document.querySelectorAll('input[name="mr"]').forEach(c => c.checked = p.recolte.includes(c.value));
}

function ouvrirAjout() {
    document.getElementById('pForm').reset();
    document.getElementById('edit-id').value = "";
    switchTab('tab-saisie');
}

function toggleLeveeField(v) { document.getElementById('field-levee').style.display = (v === 'semis' ? 'block' : 'none'); }

afficherListe();
</script>
</body>
</html>
