<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potager - Expert Data Cleaner</title>
    <style>
        :root { 
            --primary: #2c3e50; --accent: #27ae60; --danger: #e74c3c; --warning: #f39c12;
            --bg: #f8f9fa; --text: #2c3e50;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        nav { background: var(--primary); color: white; padding: 10px 15px; display: flex; gap: 15px; align-items: center; }
        .nav-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .nav-btn:hover { background: rgba(255,255,255,0.2); }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        .content-area { flex: 1; overflow-y: auto; padding: 20px; }
        .section { display: none; }
        .section.active { display: block; }

        /* SQL TABLE RAW */
        .sql-container { background: white; border: 1px solid #ddd; overflow: auto; max-height: 85vh; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-family: 'Courier New', monospace; font-size: 12px; }
        th { background: #eee; padding: 10px; border: 1px solid #ddd; position: sticky; top: 0; text-align: left; white-space: nowrap; }
        td { padding: 8px; border: 1px solid #eee; white-space: nowrap; }
        tr:hover { background: #f1f9ff; cursor: pointer; }
        .empty-cell { color: #bbb; font-style: italic; }

        /* FORMULAIRE & NETTOYEUR */
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        h3 { margin-top: 0; color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 10px; }
        label { display: block; font-size: 12px; font-weight: bold; margin: 12px 0 4px; color: #666; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        
        /* Nettoyeur de champs */
        .purge-box { background: #fff5f5; border: 1px solid #feb2b2; padding: 15px; border-radius: 6px; margin: 20px 0; }
        .purge-item { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #fed7d7; }
        .purge-item:last-child { border: none; }
        .purge-item span { font-family: monospace; font-size: 13px; font-weight: bold; }

        .btn-main { background: var(--accent); color: white; padding: 12px; border: none; border-radius: 4px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-sub { background: #eee; border: 1px solid #ccc; padding: 10px; border-radius: 4px; cursor: pointer; flex: 1; }
        .btn-danger { color: var(--danger); border-color: var(--danger); font-weight: bold; }
        
        .fab { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: var(--accent); color: white; border: none; border-radius: 50%; font-size: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<nav>
    <div style="font-weight: bold; font-size: 1.2em; margin-right: 20px;">🥬 DB Manager</div>
    <button class="nav-btn" onclick="switchTab('tab-liste')">Liste</button>
    <button class="nav-btn" onclick="switchTab('tab-sql')">Data Explorer (Brut)</button>
</nav>

<div class="main-container">
    <main class="content-area">
        <!-- VUE LISTE -->
        <div id="tab-liste" class="section active">
            <div id="list-container"></div>
        </div>

        <!-- VUE SQL BRUT -->
        <div id="tab-sql" class="section">
            <div class="sql-container">
                <table id="table-raw">
                    <thead id="sql-head"></thead>
                    <tbody id="sql-body"></tbody>
                </table>
            </div>
        </div>

        <!-- FORMULAIRE EDITION + PURGE -->
        <div id="tab-saisie" class="section">
            <div class="card">
                <h3 id="form-title">Nouvelle Fiche</h3>
                <input type="hidden" id="edit-id">
                
                <label>Nom du légume</label>
                <input type="text" id="p_nom">
                
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;"><label>Zone</label><input type="text" id="p_zone"></div>
                    <div style="flex:1;"><label>Rang</label><input type="number" id="p_rang"></div>
                </div>

                <label>Notes</label>
                <textarea id="p_notes" rows="3"></textarea>

                <!-- SECTION PURGEUR (Apparaît seulement en édition) -->
                <div id="section-purge" style="display:none;" class="purge-box">
                    <h4 style="margin:0 0 10px 0; color:var(--danger); font-size: 14px;">🛠 Nettoyage de migration</h4>
                    <p style="font-size: 11px; margin-bottom:10px;">Cochez les champs à <b>supprimer définitivement</b> du JSON :</p>
                    <div id="purge-list"></div>
                </div>

                <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">
                    <button class="btn-main" onclick="enregistrer()">💾 SAUVEGARDER LES MODIFICATIONS</button>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-sub" id="btn-dup" onclick="dupliquer()" style="display:none;">👯 Dupliquer</button>
                        <button class="btn-sub btn-danger" id="btn-del" onclick="supprimer()" style="display:none;">🗑 Supprimer Fiche</button>
                    </div>
                    <button class="btn-sub" onclick="switchTab('tab-liste')">Annuler</button>
                </div>
            </div>
        </div>
    </main>
</div>

<button class="fab" onclick="ouvrirNouveau()">+</button>

<script>
let monPotager = JSON.parse(localStorage.getItem("db_potager")) || [];

function switchTab(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 'tab-liste') renderListe();
    if(id === 'tab-sql') renderSQL();
}

// --- RENDU SQL BRUT ---
function renderSQL() {
    const head = document.getElementById('sql-head');
    const body = document.getElementById('sql-body');
    
    // Scan global de toutes les clés pour les colonnes
    let allKeys = new Set(['id', 'nom', 'zone', 'rang']);
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes.forEach(p => {
        Object.keys(p).forEach(k => allKeys.add(k));
    })));
    let columns = Array.from(allKeys);

    head.innerHTML = `<tr>${columns.map(c => `<th>${c}</th>`).join('')}</tr>`;
    
    body.innerHTML = "";
    monPotager.forEach((z, zi) => z.rangs.forEach((r, ri) => r.plantes.forEach((p, pi) => {
        let row = `<tr onclick="editer(${zi},${ri},${pi})">`;
        columns.forEach(c => {
            let val = (c === 'zone') ? z.nom : (c === 'rang') ? r.numero : p[c];
            row += `<td class="${val === undefined ? 'empty-cell' : ''}">${val ?? 'null'}</td>`;
        });
        body.innerHTML += row + "</tr>";
    })));
}

// --- RENDU LISTE ---
function renderListe() {
    const container = document.getElementById('list-container');
    container.innerHTML = "";
    monPotager.forEach((z, zi) => {
        let zDiv = `<div style="background:white; margin-bottom:15px; padding:15px; border-radius:8px; border-left:5px solid var(--accent)">
            <h2 style="margin:0 0 10px 0; font-size:1.1em">Zone ${z.nom}</h2>`;
        z.rangs.forEach((r, ri) => {
            r.plantes.forEach((p, pi) => {
                zDiv += `<div style="padding:10px; border-bottom:1px solid #f0f0f0; cursor:pointer" onclick="editer(${zi},${ri},${pi})">
                    <strong>${p.nom || 'Sans nom'}</strong> <span style="color:#888; font-size:0.8em">| ID: ${p.id} (Rang ${r.numero})</span>
                </div>`;
            });
        });
        container.innerHTML += zDiv + `</div>`;
    });
}

// --- EDITION & PURGE SÉLECTIVE ---
function editer(zi, ri, pi) {
    const p = monPotager[zi].rangs[ri].plantes[pi];
    ouvrirNouveau();
    
    document.getElementById('form-title').innerText = "Expert Mode : " + (p.nom || "Edition");
    document.getElementById('edit-id').value = p.id;
    document.getElementById('p_nom').value = p.nom || "";
    document.getElementById('p_zone').value = monPotager[zi].nom;
    document.getElementById('p_rang').value = monPotager[zi].rangs[ri].numero;
    document.getElementById('p_notes').value = p.notes || "";

    // Affichage des boutons d'action
    document.getElementById('btn-del').style.display = "block";
    document.getElementById('btn-dup').style.display = "block";
    document.getElementById('section-purge').style.display = "block";

    // Génération de la liste de purge sélective
    const purgeList = document.getElementById('purge-list');
    purgeList.innerHTML = "";
    
    // On liste TOUTES les clés présentes dans cet objet JSON spécifique
    Object.keys(p).forEach(key => {
        // On empêche la suppression de l'ID par sécurité
        if(key === 'id') return;

        const val = typeof p[key] === 'object' ? JSON.stringify(p[key]) : p[key];
        purgeList.innerHTML += `
            <div class="purge-item">
                <div style="overflow:hidden">
                    <span>${key}</span><br>
                    <small style="color:#999; display:block; text-overflow:ellipsis; white-space:nowrap; max-width:250px;">Val: ${val || 'vide'}</small>
                </div>
                <input type="checkbox" class="purge-checkbox" data-key="${key}" style="width:20px; height:20px; margin:0">
            </div>
        `;
    });
}

function enregistrer() {
    const id = document.getElementById('edit-id').value || Date.now();
    const isNew = !document.getElementById('edit-id').value;
    
    // 1. Récupération ou création de l'objet plante
    let p = { id: parseInt(id) };
    
    // Si édition, on récupère d'abord l'objet existant pour ne pas perdre les champs non affichés dans le form
    if(!isNew) {
        monPotager.forEach(z => z.rangs.forEach(r => {
            let found = r.plantes.find(x => x.id == id);
            if(found) p = {...found};
        }));
    }

    // 2. Mise à jour des champs du formulaire standard
    p.nom = document.getElementById('p_nom').value;
    p.notes = document.getElementById('p_notes').value;

    // 3. APPLICATION DE LA PURGE SÉLECTIVE
    if(!isNew) {
        document.querySelectorAll('.purge-checkbox:checked').forEach(cb => {
            const keyToDelete = cb.getAttribute('data-key');
            delete p[keyToDelete]; // Supprime la clé du JSON
        });
    }

    // 4. Placement dans la bonne zone/rang
    const zNom = document.getElementById('p_zone').value || "A";
    const rNum = document.getElementById('p_rang').value || "1";

    // Nettoyage de l'ancienne position
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(x => x.id != id)));

    let targetZone = monPotager.find(x => x.nom == zNom);
    if(!targetZone) { targetZone = {nom: zNom, rangs: []}; monPotager.push(targetZone); }
    let targetRang = targetZone.rangs.find(x => x.numero == rNum);
    if(!targetRang) { targetRang = {numero: rNum, plantes: []}; targetZone.rangs.push(targetRang); }
    
    targetRang.plantes.push(p);
    save();
}

function supprimer() {
    if(confirm("Supprimer définitivement cette fiche du JSON ?")) {
        const id = document.getElementById('edit-id').value;
        monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(x => x.id != id)));
        save();
    }
}

function dupliquer() {
    document.getElementById('edit-id').value = "";
    enregistrer();
}

function ouvrirNouveau() {
    document.getElementById('pForm').reset();
    document.getElementById('edit-id').value = "";
    document.getElementById('section-purge').style.display = "none";
    document.getElementById('btn-del').style.display = "none";
    document.getElementById('btn-dup').style.display = "none";
    document.getElementById('form-title').innerText = "Nouvelle Fiche";
    switchTab('tab-saisie');
}

function save() {
    localStorage.setItem("db_potager", JSON.stringify(monPotager));
    switchTab('tab-liste');
}

// IO
function exportData() {
    const blob = new Blob([JSON.stringify(monPotager, null, 2)], {type: "application/json"});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "export_db_potager.json";
    a.click();
}

renderListe();
</script>
</body>
</html>
