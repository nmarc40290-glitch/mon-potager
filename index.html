
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Potager - Sidebar Compacte</title>
    <style>
        /* ... (On garde le CSS précédent) ... */
        :root { 
            --primary: #2e7d32; --primary-light: #e8f5e9; --accent: #4caf50; 
            --danger: #d32f2f; --bg: #f4f9f4; --text: #2c3e50;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: var(--primary); color: white; padding: 0 15px; height: 60px; display: flex; align-items: center; justify-content: space-between; z-index: 1000; }
        .btn-menu { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }

        /* SIDEBAR AMÉLIORÉE */
        .sidebar { 
            position: fixed; left: 0; top: 60px; bottom: 0; width: 280px;
            background: white; border-right: 1px solid #ddd; z-index: 900;
            transform: translateX(-100%); transition: 0.3s;
            overflow-y: auto; padding: 15px;
        }
        .sidebar.open { transform: translateX(0); }

        /* Style des sections repliables */
        details { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        summary { 
            font-size: 0.8em; font-weight: bold; color: #888; 
            text-transform: uppercase; cursor: pointer; list-style: none;
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px 0;
        }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '▶'; font-size: 0.8em; transition: 0.2s; }
        details[open] summary::after { content: '▼'; }

        .cat-link { display: block; padding: 10px; color: var(--text); text-decoration: none; border-radius: 5px; cursor: pointer; font-size: 0.9em; }
        .cat-link:hover { background: var(--primary-light); }
        
        /* ... (Le reste du CSS Liste/Formulaire reste identique) ... */
        main { flex: 1; overflow-y: auto; position: relative; }
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .zone-box { background: white; margin-bottom: 20px; border-radius: 12px; border-left: 6px solid var(--primary); padding: 15px; }
        .plante-card { border: 1px solid #f0f0f0; margin: 10px 0; padding: 15px; border-radius: 10px; cursor: pointer; position: relative; }
        .status-badge { float: right; font-size: 0.65em; padding: 4px 8px; border-radius: 4px; color: white; }
        .fab-add { position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px; background: var(--accent); color: white; border: none; border-radius: 50%; font-size: 35px; cursor: pointer; }
        .st-bleu { background: #2196f3; } .st-violet { background: #9c27b0; } .st-vert { background: #1b5e20; } .st-gris { background: #757575; }
        .btn-action { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <button class="btn-menu" onclick="toggleSidebar()">☰</button>
    <strong id="header-title">Ma Liste</strong>
    <div id="filter-indicator"></div>
</header>

<aside id="sidebar" class="sidebar">
    <!-- Section Vue Toujours visible -->
    <div style="margin-bottom: 20px;">
        <a class="cat-link" style="font-weight: bold; background: var(--primary-light);" onclick="filtrer('tout', null)">📋 TOUT AFFICHER</a>
    </div>

    <!-- Sections Dynamiques (Zones et Légumes) -->
    <div id="dynamic-filters"></div>

    <!-- Section Data réduite de base -->
    <details>
        <summary>Sauvegarde & Import</summary>
        <div style="padding-top: 10px;">
            <button class="btn-action" style="background:#eee;" onclick="exportData()">📤 Exporter JSON</button>
            <button class="btn-action" style="background:#eee;" onclick="document.getElementById('fileInput').click()">📥 Importer JSON</button>
            <input type="file" id="fileInput" style="display:none" onchange="importData(event)">
        </div>
    </details>
</aside>

<main>
    <div id="page-list" class="page active">
        <div id="affichageDonnees"></div>
        <button class="fab-add" onclick="ouvrirSaisie()">+</button>
    </div>

    <div id="page-form" class="page">
        <div style="background: white; padding: 20px; border-radius: 15px;">
            <form id="pForm">
                <input type="hidden" id="edit-id">
                <label>Nom</label><input type="text" id="p_nom" required>
                <div style="display:flex; gap:10px; margin: 10px 0;">
                    <div style="flex:1;"><label>Zone</label><input type="text" id="p_zone"></div>
                    <div style="flex:1;"><label>Rang</label><input type="number" id="p_rang" value="1"></div>
                </div>
                <label>Notes</label><textarea id="p_notes" rows="3"></textarea>
                <button type="button" class="btn-action" style="background:var(--primary); color:white;" onclick="validerFormulaire()">💾 ENREGISTRER</button>
                <button type="button" class="btn-action" onclick="fermerSaisie()">ANNULER</button>
                <button type="button" id="del-btn" class="btn-action" style="color:var(--danger); background:none;" onclick="supprimerPlante()">Supprimer</button>
            </form>
        </div>
    </div>
</main>

<script>
let monPotager = JSON.parse(localStorage.getItem("data_potager")) || [];
let filtreActuel = { type: 'tout', valeur: null };

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

function updateSidebar() {
    const data = { zones: new Set(), plantes: new Set() };
    monPotager.forEach(z => { 
        data.zones.add(z.nom); 
        z.rangs.forEach(r => r.plantes.forEach(p => data.plantes.add(p.nom))); 
    });

    const div = document.getElementById('dynamic-filters');
    div.innerHTML = "";

    const createCollapsibleGroup = (label, set, type) => {
        if(set.size === 0) return;
        // L'absence de l'attribut 'open' rend la section réduite par défaut
        let html = `<details><summary>${label} (${set.size})</summary><div style="padding-top:5px;">`;
        Array.from(set).sort().forEach(v => {
            html += `<a class="cat-link" onclick="filtrer('${type}', '${v}')">${v}</a>`;
        });
        html += `</div></details>`;
        div.innerHTML += html;
    };

    createCollapsibleGroup("Par Zones", data.zones, 'zone');
    createCollapsibleGroup("Par Légumes", data.plantes, 'nom');
}

function filtrer(type, val) {
    filtreActuel = { type, valeur: val };
    document.getElementById('filter-indicator').innerText = val ? `(${val})` : "";
    toggleSidebar();
    afficherPotager();
}

function afficherPotager() {
    const container = document.getElementById('affichageDonnees');
    container.innerHTML = "";
    monPotager.sort((a,b) => a.nom.localeCompare(b.nom)).forEach(zone => {
        let cardsHtml = "";
        zone.rangs.forEach(rang => {
            rang.plantes.forEach(p => {
                if (filtreActuel.type === 'tout' || (filtreActuel.type === 'nom' && filtreActuel.valeur === p.nom) || (filtreActuel.type === 'zone' && filtreActuel.valeur === zone.nom)) {
                    cardsHtml += `<div class="plante-card" onclick='preparerModif("${zone.nom}", ${rang.numero}, ${p.id})'>
                        <span class="status-badge st-bleu">En cours</span>
                        <strong>${p.nom}</strong><br><small>Zone ${zone.nom} - Rang ${rang.numero}</small>
                    </div>`;
                }
            });
        });
        if(cardsHtml) container.innerHTML += `<div class="zone-box"><h2>Zone ${zone.nom}</h2>${cardsHtml}</div>`;
    });
}

// Fonctions simplifiées pour l'exemple
function ouvrirSaisie() { 
    document.getElementById('pForm').reset(); 
    document.getElementById('edit-id').value = "";
    document.getElementById('page-list').classList.remove('active');
    document.getElementById('page-form').classList.add('active');
}
function fermerSaisie() { 
    document.getElementById('page-form').classList.remove('active');
    document.getElementById('page-list').classList.add('active');
    updateSidebar(); afficherPotager();
}
function preparerModif(zN, rN, id) {
    ouvrirSaisie();
    const p = monPotager.find(z=>z.nom===zN).rangs.find(r=>r.numero==rN).plantes.find(x=>x.id==id);
    document.getElementById('edit-id').value = p.id;
    document.getElementById('p_nom').value = p.nom;
    document.getElementById('p_zone').value = zN;
    document.getElementById('p_rang').value = rN;
    document.getElementById('p_notes').value = p.notes || "";
}
function validerFormulaire() {
    const id = document.getElementById('edit-id').value ? parseInt(document.getElementById('edit-id').value) : Date.now();
    const p = { id, nom: document.getElementById('p_nom').value, notes: document.getElementById('p_notes').value };
    const zN = document.getElementById('p_zone').value.toUpperCase() || "A";
    const rN = document.getElementById('p_rang').value || 1;
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(x => x.id !== id)));
    let z = monPotager.find(x => x.nom === zN); if(!z){z={nom:zN, rangs:[]}; monPotager.push(z);}
    let r = z.rangs.find(x => x.numero == rN); if(!r){r={numero:rN, plantes:[]}; z.rangs.push(r);}
    r.plantes.push(p);
    localStorage.setItem("data_potager", JSON.stringify(monPotager));
    fermerSaisie();
}
function supprimerPlante() {
    const id = parseInt(document.getElementById('edit-id').value);
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(x => x.id !== id)));
    localStorage.setItem("data_potager", JSON.stringify(monPotager));
    fermerSaisie();
}

function exportData() {
    const blob = new Blob([JSON.stringify(monPotager)], {type: "application/json"});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "potager.json"; a.click();
}

updateSidebar();
afficherPotager();
</script>
</body>
</html>
