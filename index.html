<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Potager - Finalisé</title>
    <style>
        :root { 
            --primary: #2e7d32; --primary-light: #e8f5e9; --accent: #4caf50; --danger: #d32f2f; 
            --bg: #f4f9f4; --text: #2c3e50;
            --c-semis: #2196f3; --c-levee: #9c27b0; --c-recolte: #1b5e20; --c-prev: #ff9800; --c-fini: #757575;
        }
        
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: var(--text); }
        
        nav { background: var(--primary); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; flex-shrink: 0; }
        .nav-btns { display: flex; gap: 5px; }
        .nav-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8em; font-weight: bold; }
        .nav-btn.active { background: white; color: var(--primary); }

        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* SIDEBAR & CATÉGORIES REPLIÉES */
        .sidebar { width: 260px; background: white; border-right: 1px solid #ddd; padding: 15px; overflow-y: auto; position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: 0.3s; z-index: 1100; box-shadow: 5px 0 15px rgba(0,0,0,0.1); }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header { font-size: 0.75em; font-weight: 900; color: #666; margin-top: 15px; padding: 10px; background: #f0f0f0; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .cat-content.hidden { display: none; } /* CACHÉ PAR DÉFAUT */
        .cat-link { display: block; padding: 10px 15px; color: #333; text-decoration: none; border-bottom: 1px solid #f9f9f9; cursor: pointer; font-size: 0.85em; }

        /* PLANNING */
        #tab-planning { width: 100%; overflow: auto; background: white; }
        .planning-table { border-collapse: collapse; table-layout: fixed; min-width: 1000px; }
        .planning-table th, .planning-table td { border: 1px solid #eee; padding: 6px 2px; text-align: center; font-size: 0.75em; height: 38px; }
        .planning-table th { background: #f8f9fa; position: sticky; top: 0; z-index: 10; }
        .col-nom { width: 150px !important; position: sticky; left: 0; background: white; z-index: 11; text-align: left !important; font-weight: bold; border-right: 2px solid var(--primary) !important; padding-left: 10px !important; }
        .year-header { background: #333 !important; color: white !important; }
        
        .bar { height: 10px; border-radius: 2px; width: 90%; margin: 1px auto; }
        .bg-semis { background-color: var(--c-semis); }
        .bg-sortis { background-color: var(--c-levee); }
        .bg-recolte { background-color: var(--c-recolte); }
        .bg-prev { background-color: var(--c-prev); }
        .bg-arracher { background-color: var(--c-fini); }
        .current-month-cell { background: #fff5f5; border: 1.5px solid var(--danger) !important; }

        /* BOUTON FLOTTANT CENTRÉ */
        .fab-add { 
            position: fixed; bottom: 20px; right: 20px; 
            background: var(--accent); color: white; border: none; 
            border-radius: 50%; width: 60px; height: 60px; 
            font-size: 35px; cursor: pointer; z-index: 1001;
            display: flex; align-items: center; justify-content: center; /* CENTRAGE FLEXBOX */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            line-height: 0; padding: 0; 
        }

        /* FORMULAIRE & LISTE */
        .content-area { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .section { display: none; padding: 15px; }
        .section.active { display: block; }
        .zone-box { background: white; margin-bottom: 20px; border-radius: 10px; border-left: 6px solid var(--primary); padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .plante-card { background: #fff; border: 1px solid #eee; margin: 8px 0; padding: 12px; border-radius: 8px; cursor: pointer; }
        .status-badge { float: right; font-size: 0.65em; padding: 3px 6px; border-radius: 4px; color: white; font-weight: bold; text-transform: uppercase; }
        .st-semis { background: var(--c-semis); }
        .st-sortis { background: var(--c-levee); }
        .st-recolte { background: var(--c-recolte); }
        .st-arracher { background: var(--c-fini); }

        form { background: white; padding: 20px; border-radius: 12px; max-width: 500px; margin: 0 auto; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px; }
        .mois-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; background: #f1f1f1; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<nav>
    <div onclick="toggleSidebar()" style="cursor:pointer; font-weight:900;">☰ MON POTAGER</div>
    <div class="nav-btns">
        <button class="nav-btn active" id="btn-list" onclick="switchTab('tab-liste')">Liste</button>
        <button class="nav-btn" id="btn-plan" onclick="switchTab('tab-planning')">Planning</button>
    </div>
</nav>

<button id="add-btn" class="fab-add" onclick="ouvrirAjout()"><span>+</span></button>

<div class="main-container">
    <aside id="sidebar" class="sidebar">
        <a class="cat-link" style="font-weight:bold; background:var(--primary-light)" onclick="filtrer('tout', null)">📋 TOUT AFFICHER</a>
        <div id="sidebar-content"></div>
    </aside>

    <main class="content-area">
        <div id="tab-liste" class="section active"><div id="affichageDonnees"></div></div>
        <div id="tab-planning" class="section" style="padding:0;"><table class="planning-table"><thead><tr id="p-years"></tr><tr id="p-months"></tr></thead><tbody id="p-body"></tbody></table></div>
        <div id="tab-saisie" class="section">
            <form id="pForm">
                <input type="hidden" id="edit-id">
                <div id="creation-status-div"><label>Démarrage</label><select id="p_init" onchange="toggleLeveeField(this.value)"><option value="semis">🌱 Semis</option><option value="planter">🚜 Plantation</option></select></div>
                <label>Légume</label><input type="text" id="p_nom" required list="noms-existants"><datalist id="noms-existants"></datalist>
                <div style="display:flex; gap:10px;"><div style="flex:1;"><label>Zone</label><input type="text" id="p_zone"></div><div style="flex:1;"><label>Rang</label><select id="p_rang"></select></div></div>
                <div id="field-levee" style="display:none;"><label>Date levée (réelle)</label><input type="date" id="p_date_levee"></div>
                <label id="lbl_date_main">Date mise en terre</label><input type="date" id="p_date">
                <label>Récolte réelle (début)</label><input type="date" id="p_date_recolte">
                <label>Récolte prévisionnelle (orange)</label><div class="mois-grid" id="moisGrid"></div>
                <label>Date fin / Arrachage (gris)</label><input type="date" id="p_date_fin">
                
                <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">
                    <button type="button" onclick="validerFormulaire()" style="background:var(--primary); color:white; padding:15px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">💾 ENREGISTRER</button>
                    <button type="button" id="dup-btn" style="background:var(--c-semis); color:white; padding:12px; border:none; border-radius:8px; display:none; cursor:pointer;" onclick="dupliquerPlante()">👯 DUPLIQUER</button>
                    <button type="button" onclick="switchTab('tab-liste')" style="background:#ccc; color:#333; padding:12px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">❌ ANNULER / RETOUR</button>
                    <button type="button" id="del-btn" style="color:red; background:none; border:none; display:none; text-decoration:underline; cursor:pointer;" onclick="supprimerViaForm()">Supprimer la fiche</button>
                </div>
            </form>
        </div>
    </main>
</div>

<script>
let monPotager = JSON.parse(localStorage.getItem("data_potager")) || [];
let filtreActuel = { type: 'tout', valeur: null };
const MOIS_NOM = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Juil", "Août", "Sept", "Oct", "Nov", "Déc"];
const TODAY = new Date();

function calculerStatutUnique(p, dateRef = TODAY) {
    const dStart = p.date ? new Date(p.date) : null;
    const dLevee = p.dateLevee ? new Date(p.dateLevee) : null;
    const dRec = p.dateRecolte ? new Date(p.dateRecolte) : null;
    const dFin = (p.dateFin && p.dateFin !== "Non définie") ? new Date(p.dateFin) : null;
    if (dFin && dateRef > dFin) return 'arracher';
    if (dRec && dateRef >= dRec) return 'recolte';
    if (dLevee && dateRef >= dLevee) return 'sortis';
    if (dStart && dateRef >= dStart) return 'semis';
    return null;
}

for(let i=1; i<=30; i++) { let o = document.createElement('option'); o.value = i; o.innerText = "Rang " + i; document.getElementById('p_rang').appendChild(o); }
MOIS_NOM.forEach(m => { document.getElementById('moisGrid').innerHTML += `<label><input type="checkbox" name="mr" value="${m}"> ${m}</label>`; });

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function toggleLeveeField(v) { document.getElementById('field-levee').style.display = (v === 'semis' ? 'block' : 'none'); document.getElementById('lbl_date_main').innerText = (v === 'semis' ? "Date Semis" : "Date Plantation"); }

function switchTab(tabId) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    document.getElementById('sidebar').classList.remove('open');
    if(tabId === 'tab-liste') { document.getElementById('btn-list').classList.add('active'); updateSidebar(); afficherPotager(); }
    if(tabId === 'tab-planning') { document.getElementById('btn-plan').classList.add('active'); genererPlanning(); }
}

function updateSidebar() {
    const data = { zones: new Set(), plantes: new Set() };
    monPotager.forEach(z => { data.zones.add(z.nom); z.rangs.forEach(r => r.plantes.forEach(p => data.plantes.add(p.nom))); });
    const container = document.getElementById('sidebar-content'); container.innerHTML = "";
    const build = (titre, items, type, id) => {
        // AJOUT DE LA CLASSE hidden ICI POUR LE REPLI PAR DÉFAUT
        let html = `<div class="sidebar-header" onclick="document.getElementById('${id}').classList.toggle('hidden')"><span>${titre}</span></div><div id="${id}" class="cat-content hidden">`;
        Array.from(items).sort().forEach(v => html += `<a class="cat-link" onclick="filtrer('${type}', '${v}')">${v}</a>`);
        container.innerHTML += html + `</div>`;
    };
    build("ZONES", data.zones, 'zone', 'side-z');
    build("LÉGUMES", data.plantes, 'nom', 'side-l');
}

function genererPlanning() {
    let minYear = TODAY.getFullYear();
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes.forEach(p => { if(p.date) { let y = new Date(p.date).getFullYear(); if(y < minYear) minYear = y; } })));
    let maxYear = TODAY.getFullYear() + 1;
    const hY = document.getElementById('p-years'); const hM = document.getElementById('p-months'); const body = document.getElementById('p-body');
    hY.innerHTML = hM.innerHTML = '<th class="col-nom"></th>'; body.innerHTML = "";
    for(let y = minYear; y <= maxYear; y++) {
        hY.innerHTML += `<th colspan="12" class="year-header">${y}</th>`;
        MOIS_NOM.forEach((m, i) => hM.innerHTML += `<th class="${(y==TODAY.getFullYear() && i==TODAY.getMonth()) ? 'current-month-cell' : ''}">${m}</th>`);
    }
    let flat = []; monPotager.forEach(z => z.rangs.forEach(r => r.plantes.forEach(p => flat.push({...p, zone:z.nom}))));
    flat.sort((a,b) => a.nom.localeCompare(b.nom)).forEach(p => {
        let row = `<tr><td class="col-nom">${p.nom} <small>(Z:${p.zone})</small></td>`;
        for(let y = minYear; y <= maxYear; y++) {
            MOIS_NOM.forEach((m, mi) => {
                const finMois = new Date(y, mi + 1, 0);
                const st = calculerStatutUnique(p, finMois);
                const isPrev = p.recolte && p.recolte.includes(m);
                let bars = "";
                if (isPrev) bars += `<div class="bar bg-prev"></div>`;
                if (st) bars += `<div class="bar bg-${st}"></div>`;
                row += `<td class="${(y==TODAY.getFullYear() && mi==TODAY.getMonth()) ? 'current-month-cell' : ''}">${bars}</td>`;
            });
        }
        body.innerHTML += row + "</tr>";
    });
}

function afficherPotager() {
    const container = document.getElementById('affichageDonnees'); container.innerHTML = "";
    monPotager.forEach((zone, zIdx) => {
        let cards = "";
        zone.rangs.forEach((rang, rIdx) => {
            rang.plantes.forEach((p, pIdx) => {
                if (filtreActuel.type === 'tout' || (filtreActuel.type === 'nom' && filtreActuel.valeur === p.nom) || (filtreActuel.type === 'zone' && filtreActuel.valeur === zone.nom)) {
                    const st = calculerStatutUnique(p) || 'semis';
                    cards += `<div class="plante-card" onclick="preparerEdition(${zIdx},${rIdx},${pIdx})">
                        <span class="status-badge st-${st}">${st === 'arracher' ? 'arraché' : st}</span>
                        <strong>${p.nom}</strong><br><small>Zone ${zone.nom} - Rang ${rang.numero}</small>
                    </div>`;
                }
            });
        });
        if(cards) container.innerHTML += `<div class="zone-box"><h3>ZONE ${zone.nom}</h3>${cards}</div>`;
    });
}

function filtrer(type, val) { filtreActuel = { type, valeur: val }; toggleSidebar(); afficherPotager(); }
function ouvrirAjout() { document.getElementById('pForm').reset(); document.getElementById('edit-id').value = ""; document.getElementById('creation-status-div').style.display = 'block'; document.getElementById('dup-btn').style.display = 'none'; document.getElementById('del-btn').style.display = 'none'; toggleLeveeField('semis'); switchTab('tab-saisie'); }
function preparerEdition(zi, ri, pi) {
    const p = monPotager[zi].rangs[ri].plantes[pi]; ouvrirAjout();
    document.getElementById('edit-id').value = p.id; document.getElementById('p_nom').value = p.nom;
    document.getElementById('p_zone').value = monPotager[zi].nom; document.getElementById('p_rang').value = monPotager[zi].rangs[ri].numero;
    document.getElementById('p_date').value = p.date || ""; document.getElementById('p_date_levee').value = p.dateLevee || "";
    document.getElementById('p_date_recolte').value = p.dateRecolte || ""; document.getElementById('p_date_fin').value = p.dateFin === "Non définie" ? "" : p.dateFin;
    document.getElementById('creation-status-div').style.display = 'none'; document.getElementById('dup-btn').style.display = 'block'; document.getElementById('del-btn').style.display = 'block';
    document.querySelectorAll('input[name="mr"]').forEach(cb => cb.checked = p.recolte.includes(cb.value));
}

function validerFormulaire() {
    const nom = document.getElementById('p_nom').value; if(!nom) return;
    const p = { id: document.getElementById('edit-id').value ? parseInt(document.getElementById('edit-id').value) : Date.now(), nom, date: document.getElementById('p_date').value, dateLevee: document.getElementById('p_date_levee').value, dateRecolte: document.getElementById('p_date_recolte').value, dateFin: document.getElementById('p_date_fin').value || "Non définie", recolte: Array.from(document.querySelectorAll('input[name="mr"]:checked')).map(cb => cb.value) };
    const zN = document.getElementById('p_zone').value.toUpperCase() || "A"; const rN = document.getElementById('p_rang').value;
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(x => x.id !== p.id)));
    let z = monPotager.find(x => x.nom === zN); if(!z){z={nom:zN, rangs:[]}; monPotager.push(z);}
    let r = z.rangs.find(x => x.numero === rN); if(!r){r={numero:rN, plantes:[]}; z.rangs.push(r);}
    r.plantes.push(p); localStorage.setItem("data_potager", JSON.stringify(monPotager)); switchTab('tab-liste');
}
function dupliquerPlante() { document.getElementById('edit-id').value = ""; validerFormulaire(); }
function supprimerViaForm() { if(confirm("Supprimer ?")) { const id = parseInt(document.getElementById('edit-id').value); monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(p => p.id !== id))); localStorage.setItem("data_potager", JSON.stringify(monPotager)); switchTab('tab-liste'); } }

updateSidebar(); afficherPotager();
</script>
</body>
</html>
