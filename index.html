<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Potager - Planning Avancé</title>
    <style>
        :root { 
            --primary: #2e7d32; --primary-light: #e8f5e9; --accent: #4caf50; --danger: #d32f2f; 
            --bg: #f4f9f4; --text: #2c3e50;
            /* Couleurs Fixes */
            --c-sous-terre: #2196f3; /* Bleu */
            --c-attente: #9c27b0;    /* Violet */
            --c-recolte: #1b5e20;    /* Vert */
            --c-fini: #757575;       /* Gris */
            --c-prev: #ff9800;       /* Orange (prévision) */
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: var(--text); }
        nav { background: var(--primary); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; flex-shrink: 0; }
        .nav-btns { display: flex; gap: 5px; }
        .nav-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8em; font-weight: bold; }
        .nav-btn.active { background: white; color: var(--primary); }
        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: white; border-right: 1px solid #ddd; padding: 15px; overflow-y: auto; position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: 0.3s; z-index: 1100; box-shadow: 5px 0 15px rgba(0,0,0,0.1); }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header { font-size: 0.75em; font-weight: 900; color: #666; margin-top: 15px; padding: 10px; background: #f0f0f0; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .cat-content.hidden { display: none; }
        .cat-link { display: block; padding: 10px 15px; color: #333; text-decoration: none; border-bottom: 1px solid #f9f9f9; cursor: pointer; font-size: 0.85em; }
        
        /* Liste & Cards */
        .content-area { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .section { display: none; padding: 15px; }
        .section.active { display: block; }
        .zone-box { background: white; margin-bottom: 20px; border-radius: 10px; border-left: 6px solid var(--primary); padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .plante-card { background: #fff; border: 1px solid #eee; margin: 8px 0; padding: 12px; border-radius: 8px; cursor: pointer; position: relative; min-height: 50px; }
        
        .status-badge { float: right; font-size: 0.65em; padding: 4px 8px; border-radius: 4px; color: white; font-weight: bold; text-transform: uppercase; white-space: nowrap; margin-left: 5px; }
        
        /* Classes CSS de couleurs pour la liste */
        .st-bleu { background: var(--c-sous-terre); }
        .st-violet { background: var(--c-attente); }
        .st-vert { background: var(--c-recolte); }
        .st-gris { background: var(--c-fini); }

        /* Formulaire */
        form { background: white; padding: 20px; border-radius: 12px; max-width: 500px; margin: 0 auto; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px; font-size: 16px; }
        .mois-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #f1f1f1; padding: 15px; border-radius: 8px; }

        /* --- STYLES PLANNING AMÉLIORÉS --- */
        #tab-planning { width: 100%; overflow: auto; background: white; }
        .planning-table { border-collapse: collapse; table-layout: fixed; min-width: 1400px; }
        .planning-table th, .planning-table td { border: 1px solid #eee; padding: 6px 2px; text-align: center; font-size: 0.75em; height: 50px; position: relative; }
        .col-nom { width: 160px !important; position: sticky; left: 0; background: white !important; z-index: 20; text-align: left !important; font-weight: bold; border-right: 2px solid var(--primary) !important; padding-left: 10px !important; }
        
        /* Conteneur pour permettre la superposition de barres */
        .planning-cell { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; width: 100%; position: absolute; top:0; left:0; }
        .bar-container { display: flex; flex-direction: column; gap: 2px; width: 92%; }

        /* Styles des barres individuelles */
        .bar { height: 8px; border-radius: 2px; width: 100%; }
        
        /* Couleurs pour le Planning (classes dynamiques) */
        .bg-bleu { background-color: var(--c-sous-terre); }
        .bg-violet { background-color: var(--c-attente); }
        .bg-vert { background-color: var(--c-recolte); }
        .bg-gris { background-color: var(--c-fini); }
        .bg-prev { background-color: var(--c-prev); }

        .fab-add { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: white; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 35px; cursor: pointer; z-index: 1001; }
        .btn-io { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<nav>
    <div onclick="toggleSidebar()" style="cursor:pointer; font-weight:900;">☰ FILTRES & MENU</div>
    <div class="nav-btns">
        <button class="nav-btn active" id="btn-list" onclick="switchTab('tab-liste')">Liste</button>
        <button class="nav-btn" id="btn-plan" onclick="switchTab('tab-planning')">Planning</button>
    </div>
</nav>

<button class="fab-add" onclick="ouvrirAjout()">+</button>

<div class="main-container">
    <aside id="sidebar" class="sidebar">
        <a class="cat-link" style="font-weight:bold; background:var(--primary-light)" onclick="filtrer('tout', null)">📋 TOUT AFFICHER</a>
        <div id="sidebar-content"></div>
        <hr style="margin-top:20px;">
        <button class="btn-io" style="background:#eee;" onclick="exportData()">📤 EXPORTER (JSON)</button>
        <button class="btn-io" style="background:#eee;" onclick="document.getElementById('fileInput').click()">📥 IMPORTER</button>
        <input type="file" id="fileInput" style="display:none" onchange="importData(event)">
    </aside>

    <main class="content-area">
        <div id="tab-liste" class="section active"><div id="affichageDonnees"></div></div>
        <div id="tab-planning" class="section" style="padding:0;"><table class="planning-table"><thead><tr id="p-years"></tr><tr id="p-months"></tr></thead><tbody id="p-body"></tbody></table></div>
        <div id="tab-saisie" class="section">
            <form id="pForm">
                <input type="hidden" id="edit-id">
                <div id="creation-status-div">
                    <label>Type de culture</label>
                    <select id="p_init" onchange="toggleLeveeField(this.value)">
                        <option value="semis">🌱 Semis (Graines)</option>
                        <option value="planter">🚜 Plantation (Plants)</option>
                    </select>
                </div>
                <label>Nom du légume</label><input type="text" id="p_nom" required>
                <div style="display:flex; gap:10px;"><div style="flex:1;"><label>Zone</label><input type="text" id="p_zone"></div><div style="flex:1;"><label>Rang</label><select id="p_rang"></select></div></div>
                <div id="field-levee"><label>Date de levée</label><input type="date" id="p_date_levee"></div>
                <label id="lbl_date_main">Date Semis</label><input type="date" id="p_date">
                <label>Date début récolte réelle</label><input type="date" id="p_date_recolte">
                <label>Prévision Récolte (Orange)</label><div class="mois-grid" id="moisGrid"></div>
                <label>Date fin / Arrachage</label><input type="date" id="p_date_fin">
                <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">
                    <button type="button" onclick="validerFormulaire()" style="background:var(--primary); color:white; padding:15px; border:none; border-radius:8px; font-weight:bold;">💾 ENREGISTRER</button>
                    <button type="button" id="dup-btn" style="background:var(--c-sous-terre); color:white; padding:12px; border:none; border-radius:8px; display:none;" onclick="dupliquerPlante()">👯 DUPLIQUER</button>
                    <button type="button" id="del-btn" style="color:red; background:none; border:none; display:none;" onclick="supprimerViaForm()">Supprimer la fiche</button>
                    <button type="button" onclick="switchTab('tab-liste')" style="background:#ccc; padding:12px; border:none; border-radius:8px;">ANNULER</button>
                </div>
            </form>
        </div>
    </main>
</div>

<script>
let monPotager = JSON.parse(localStorage.getItem("data_potager")) || [];
let filtreActuel = { type: 'tout', valeur: null };
const MOIS_NOM = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Juil", "Août", "Sept", "Oct", "Nov", "Déc"];
const TODAY = new Date();

// --- INIT ---
for(let i=1; i<=30; i++) { 
    let o = document.createElement('option'); o.value = i; o.innerText = "Rang " + i; 
    document.getElementById('p_rang').appendChild(o); 
}
MOIS_NOM.forEach(m => { 
    document.getElementById('moisGrid').innerHTML += `<div style="display:flex; flex-direction:column; align-items:center;"><input type="checkbox" name="mr" value="${m}"><span style="font-size:0.7em">${m}</span></div>`; 
});

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function toggleLeveeField(v) { 
    document.getElementById('field-levee').style.display = (v === 'semis' ? 'block' : 'none'); 
    document.getElementById('lbl_date_main').innerText = (v === 'semis' ? "Date Semis" : "Date Plantation"); 
}

function switchTab(tabId) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if(tabId === 'tab-liste') { document.getElementById('btn-list').classList.add('active'); updateSidebar(); afficherPotager(); }
    if(tabId === 'tab-planning') { document.getElementById('btn-plan').classList.add('active'); genererPlanning(); }
    document.getElementById('sidebar').classList.remove('open');
}

/**
 * Logique unifiée pour le TEXTE et la COULEUR du statut (Liste + Planning)
 */
function getStatutInfo(p, dateRef = TODAY) {
    const dStart = p.date ? new Date(p.date) : null;
    const dLevee = p.dateLevee ? new Date(p.dateLevee) : null;
    const dRec = p.dateRecolte ? new Date(p.dateRecolte) : null;
    const dFin = (p.dateFin && p.dateFin !== "Non définie" && p.dateFin !== "") ? new Date(p.dateFin) : null;

    let typeLabel = (p.typeInit === 'semis') ? "Semis" : "Plantation";

    // 1. Arraché / Fini -> GRIS
    if (dFin && dateRef >= dFin) {
        return { text: "Fini", color: "gris" };
    }
    // 2. En Récolte -> VERT
    if (dRec && dateRef >= dRec) {
        return { text: `${typeLabel} - Récolte`, color: "vert" };
    }
    // 3. Cas spécifique Semis
    if (p.typeInit === 'semis') {
        // En attente récolte (levé) -> VIOLET
        if (dLevee && dateRef >= dLevee) {
            return { text: "Semis - En attente récolte", color: "violet" };
        }
        // Juste semé (sous terre) -> BLEU
        if (dStart && dateRef >= dStart) {
            return { text: "Semis - Sous terre", color: "bleu" };
        }
    } else {
        // Plantation en attente récolte -> VIOLET
        if (dStart && dateRef >= dStart) {
            return { text: "Plantation - En attente récolte", color: "violet" };
        }
    }
    return null; // Pas encore démarré
}

function afficherPotager() {
    const container = document.getElementById('affichageDonnees'); container.innerHTML = "";
    monPotager.forEach((zone, zIdx) => {
        let cards = "";
        zone.rangs.sort((a,b)=>a.numero-b.numero).forEach((rang, rIdx) => {
            rang.plantes.forEach((p, pIdx) => {
                if (filtreActuel.type === 'tout' || (filtreActuel.type === 'nom' && filtreActuel.valeur === p.nom) || (filtreActuel.type === 'zone' && filtreActuel.valeur === zone.nom)) {
                    
                    const info = getStatutInfo(p) || { text: "En attente", color: "gris" }; // Sécurité
                    
                    cards += `<div class="plante-card" onclick="preparerEdition(${zIdx},${monPotager[zIdx].rangs.indexOf(rang)},${pIdx})">
                        <span class="status-badge st-${info.color}">${info.text}</span>
                        <strong>${p.nom}</strong><br><small>Zone ${zone.nom} - Rang ${rang.numero}</small>
                    </div>`;
                }
            });
        });
        if(cards) container.innerHTML += `<div class="zone-box"><h3>ZONE ${zone.nom}</h3>${cards}</div>`;
    });
}

// --- GENERATION DU PLANNING (CRUCIAL) ---
function genererPlanning() {
    const hY = document.getElementById('p-years'), hM = document.getElementById('p-months'), body = document.getElementById('p-body');
    hY.innerHTML = hM.innerHTML = '<th class="col-nom">Légume</th>';
    
    // Définition de la fenêtre temporelle du planning (ex: 2025-2026)
    const START_YEAR = 2025;
    const END_YEAR = 2026;

    for(let y=START_YEAR; y<=END_YEAR; y++) {
        hY.innerHTML += `<th colspan="12" style="background:#333; color:white;">${y}</th>`;
        MOIS_NOM.forEach(m => hM.innerHTML += `<th>${m}</th>`);
    }
    body.innerHTML = "";
    
    // On met à plat toutes les plantes pour les trier par nom
    let flat = []; 
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes.forEach(p => flat.push({...p, z:z.nom, r:r.numero}))));
    
    flat.sort((a,b) => a.nom.localeCompare(b.nom)).forEach(p => {
        let row = `<tr><td class="col-nom">${p.nom} <br><small>Z:${p.z} R:${p.r}</small></td>`;
        
        // Dates clés pour les comparaisons temporelles
        const dStart = p.date ? new Date(p.date) : null;
        const dFin = (p.dateFin && p.dateFin !== "Non définie") ? new Date(p.dateFin) : null;
        
        for(let y=START_YEAR; y<=END_YEAR; y++) {
            MOIS_NOM.forEach((m, mi) => {
                const dateMoisDebut = new Date(y, mi, 1);
                const dateMoisFin = new Date(y, mi + 1, 0); // Dernier jour du mois

                // --- LOGIQUE DE FILTRAGE TEMPOREL ---
                let barsHTML = "";
                let classesCouleurs = [];

                // 1. GESTION DES PRÉVISIONS (Orange) : Toujours affichée si cochée
                if(p.recolte && p.recolte.includes(m)) {
                    classesCouleurs.push("bg-prev");
                }

                // 2. GESTION DU PASSÉ ET DU FUTUR
                
                // Si le mois est FUTUR (après TODAY) : On n'affiche QUE la prévision orange (déjà gérée)
                const estFutur = dateMoisDebut > TODAY;

                // Si le mois est PASSÉ ou PRÉSENT
                if (!estFutur) {
                    // Vérifier si la plante a déjà démarré (mise en terre)
                    const aDemarre = dStart && dStart <= dateMoisFin;
                    
                    if (aDemarre) {
                        const infoStatut = getStatutInfo(p, dateMoisFin);

                        // Si la plante est finie, vérifier si ce mois-ci est le mois de l'arrachage
                        if (infoStatut && infoStatut.color === 'gris') {
                            const estMoisArrachage = dFin && dFin >= dateMoisDebut && dFin <= dateMoisFin;
                            if (estMoisArrachage) {
                                classesCouleurs.push("bg-gris");
                            }
                            // Si c'est APRES le mois d'arrachage, on n'affiche plus rien (vide)
                        } 
                        // Sinon (Bleu, Violet, Vert), on l'affiche
                        else if (infoStatut) {
                            classesCouleurs.push(`bg-${infoStatut.color}`);
                        }
                    }
                    // Si dStart n'est pas encore passé, la cellule reste vide (géré implicitement)
                }

                // --- GENERATION DU HTML POUR LES BARRES MULTIPLES ---
                if (classesCouleurs.length > 0) {
                    barsHTML = '<div class="planning-cell"><div class="bar-container">';
                    // On trie pour mettre l'orange (prévision) en premier/haut, gris en dernier
                    classesCouleurs.sort((a, b) => {
                        if (a === 'bg-prev') return -1;
                        if (b === 'bg-prev') return 1;
                        if (a === 'bg-gris') return 1;
                        if (b === 'bg-gris') return -1;
                        return 0;
                    });
                    
                    classesCouleurs.forEach(cls => {
                        barsHTML += `<div class="bar ${cls}"></div>`;
                    });
                    barsHTML += '</div></div>';
                }

                row += `<td>${barsHTML}</td>`;
            });
        }
        body.innerHTML += row + "</tr>";
    });
}

// --- CRUD ---
function validerFormulaire() {
    const nom = document.getElementById('p_nom').value; if(!nom) return;
    const typeInit = document.getElementById('p_init').value;
    const dStart = document.getElementById('p_date').value;
    const dLevee = document.getElementById('p_date_levee').value;
    const dRec = document.getElementById('p_date_recolte').value;
    const dFin = document.getElementById('p_date_fin').value;

    const p = { 
        id: document.getElementById('edit-id').value ? parseInt(document.getElementById('edit-id').value) : Date.now(), 
        nom, typeInit, date: dStart, dateLevee: dLevee, dateRecolte: dRec, dateFin: dFin || "Non définie",
        recolte: Array.from(document.querySelectorAll('input[name="mr"]:checked')).map(cb => cb.value)
    };

    const zN = document.getElementById('p_zone').value.toUpperCase() || "A";
    const rN = document.getElementById('p_rang').value;
    
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(x => x.id !== p.id)));
    let z = monPotager.find(x => x.nom === zN); if(!z){z={nom:zN, rangs:[]}; monPotager.push(z);}
    let r = z.rangs.find(x => x.numero === rN); if(!r){r={numero:rN, plantes:[]}; z.rangs.push(r);}
    r.plantes.push(p); 
    
    localStorage.setItem("data_potager", JSON.stringify(monPotager));
    switchTab('tab-liste');
}

function ouvrirAjout() {
    document.getElementById('pForm').reset();
    document.getElementById('edit-id').value = "";
    document.getElementById('dup-btn').style.display = 'none';
    document.getElementById('del-btn').style.display = 'none';
    toggleLeveeField('semis');
    switchTab('tab-saisie');
}

function preparerEdition(zi, ri, pi) {
    const p = monPotager[zi].rangs[ri].plantes[pi];
    ouvrirAjout();
    document.getElementById('edit-id').value = p.id;
    document.getElementById('p_nom').value = p.nom;
    document.getElementById('p_init').value = p.typeInit || "semis";
    document.getElementById('p_zone').value = monPotager[zi].nom;
    document.getElementById('p_rang').value = monPotager[zi].rangs[ri].numero;
    document.getElementById('p_date').value = p.date || "";
    document.getElementById('p_date_levee').value = p.dateLevee || "";
    document.getElementById('p_date_recolte').value = p.dateRecolte || "";
    document.getElementById('p_date_fin').value = (p.dateFin === "Non définie") ? "" : p.dateFin;
    document.getElementById('dup-btn').style.display = 'block';
    document.getElementById('del-btn').style.display = 'block';
    document.querySelectorAll('input[name="mr"]').forEach(cb => cb.checked = p.recolte.includes(cb.value));
    toggleLeveeField(p.typeInit || "semis");
}

function updateSidebar() {
    const data = { zones: new Set(), plantes: new Set() };
    monPotager.forEach(z => { data.zones.add(z.nom); z.rangs.forEach(r => r.plantes.forEach(p => data.plantes.add(p.nom))); });
    const container = document.getElementById('sidebar-content'); container.innerHTML = "";
    const build = (titre, items, type, id) => {
        let html = `<div class="sidebar-header" onclick="document.getElementById('${id}').classList.toggle('hidden')"><span>${titre}</span></div><div id="${id}" class="cat-content hidden">`;
        Array.from(items).sort().forEach(v => html += `<a class="cat-link" onclick="filtrer('${type}', '${v}')">${v}</a>`);
        container.innerHTML += html + `</div>`;
    };
    build("ZONES", data.zones, 'zone', 'side-z');
    build("LÉGUMES", data.plantes, 'nom', 'side-l');
}

function filtrer(type, val) { filtreActuel = { type, valeur: val }; toggleSidebar(); afficherPotager(); }
function exportData() {
    const blob = new Blob([JSON.stringify(monPotager)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = "potager.json"; a.click();
}
function importData(e) {
    const reader = new FileReader();
    reader.onload = (ev) => { monPotager = JSON.parse(ev.target.result); localStorage.setItem("data_potager", JSON.stringify(monPotager)); location.reload(); };
    reader.readAsText(e.target.files[0]);
}
function dupliquerPlante() { document.getElementById('edit-id').value = ""; validerFormulaire(); }
function supprimerViaForm() { if(confirm("Supprimer ?")) { const id = parseInt(document.getElementById('edit-id').value); monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(p => p.id !== id))); localStorage.setItem("data_potager", JSON.stringify(monPotager)); switchTab('tab-liste'); } }

updateSidebar();
afficherPotager();
</script>
</body>
</html>
