<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potager v3</title>
    <style>
        :root { 
            --primary: #2e7d32; --accent: #4caf50; --bg: #f4f9f4; 
            --c-sous-terre: #2196f3; --c-attente: #9c27b0; --c-recolte: #1b5e20;
            --c-fini: #757575; --c-prev: #ff9800;
        }
        
        /* Structure de base */
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Navigation */
        nav { background: var(--primary); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .nav-btns { display: flex; gap: 8px; }
        .nav-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.9em; transition: 0.2s; }
        .nav-btn.active { background: white; color: var(--primary); }

        /* Conteneur principal */
        .main-container { flex: 1; position: relative; overflow: hidden; }

        /* Sections */
        .section { display: none; height: 100%; overflow-y: auto; padding: 15px; box-sizing: border-box; }
        .section.active { display: block; }

        /* --- PLANNING SPECIAL (Sticky Fix) --- */
        #tab-planning { padding: 0; } /* Pas de padding pour coller aux bords */
        .planning-wrapper { width: 100%; height: 100%; overflow: auto; background: white; }
        .planning-table { border-collapse: separate; border-spacing: 0; min-width: 1600px; }
        .planning-table th, .planning-table td { border: 0.5px solid #eee; padding: 4px; text-align: center; height: 50px; min-width: 45px; position: relative; }
        
        /* La colonne nom magique */
        .col-nom { 
            position: sticky !important; left: 0 !important; z-index: 10 !important; 
            background: white !important; width: 140px !important; min-width: 140px !important;
            border-right: 2px solid var(--primary) !important; font-weight: bold; font-size: 0.85em;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        thead th { position: sticky; top: 0; background: #eee; z-index: 5; }
        thead th.col-nom { z-index: 20; }

        /* Barres de planning */
        .bar-container { display: flex; flex-direction: column; gap: 2px; width: 100%; align-items: center; }
        .bar { height: 8px; border-radius: 2px; width: 90%; }
        .bg-bleu { background: var(--c-sous-terre); }
        .bg-violet { background: var(--c-attente); }
        .bg-vert { background: var(--c-recolte); }
        .bg-gris { background: var(--c-fini); }
        .bg-prev { background: var(--c-prev); }

        /* --- LISTE ET CARTES --- */
        .zone-box { background: white; margin-bottom: 20px; border-radius: 10px; border-left: 6px solid var(--primary); padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .zone-box h3 { margin-top: 0; color: var(--primary); border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .plante-card { border: 1px solid #f0f0f0; margin: 8px 0; padding: 12px; border-radius: 8px; background: #fafafa; cursor: pointer; position: relative; }
        .status-badge { float: right; font-size: 0.7em; padding: 4px 8px; border-radius: 4px; color: white; font-weight: bold; text-transform: uppercase; }

        /* Formulaire */
        .fab-add { position: fixed; bottom: 25px; right: 25px; background: var(--accent); color: white; border: none; border-radius: 50%; width: 65px; height: 65px; font-size: 35px; z-index: 1001; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .mois-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #f0f0f0; padding: 10px; border-radius: 8px; }
        label { font-weight: bold; display: block; margin-top: 10px; font-size: 0.9em; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

<nav>
    <div style="font-size: 1.1em; font-weight: 900; letter-spacing: 1px;">🌿 POTAGER</div>
    <div class="nav-btns">
        <button class="nav-btn active" id="btn-list" onclick="switchTab('tab-liste')">LISTE</button>
        <button class="nav-btn" id="btn-plan" onclick="switchTab('tab-planning')">PLANNING</button>
    </div>
</nav>

<button class="fab-add" onclick="ouvrirAjout()">+</button>

<div class="main-container">
    <!-- ONGLET LISTE -->
    <div id="tab-liste" class="section active"></div>
    
    <!-- ONGLET PLANNING -->
    <div id="tab-planning" class="section">
        <div class="planning-wrapper">
            <table class="planning-table">
                <thead>
                    <tr id="p-years"></tr>
                    <tr id="p-months"></tr>
                </thead>
                <tbody id="p-body"></tbody>
            </table>
        </div>
    </div>

    <!-- ONGLET FORMULAIRE -->
    <div id="tab-saisie" class="section">
        <form id="pForm">
            <input type="hidden" id="edit-id">
            <label>Mode de démarrage</label>
            <select id="p_init" onchange="toggleLeveeField(this.value)">
                <option value="semis">🌱 Semis en terre</option>
                <option value="planter">🚜 Plantation (jeune plant)</option>
            </select>
            <input type="text" id="p_nom" placeholder="Nom du légume (ex: Tomate)" required>
            <input type="text" id="p_zone" placeholder="Zone / Carré (ex: A1)">
            <select id="p_rang"></select>
            
            <div id="field-levee" style="display:none">
                <label>Date de Levée constatée</label>
                <input type="date" id="p_date_levee">
            </div>
            
            <label id="lbl_date_main">Date de l'action</label>
            <input type="date" id="p_date">
            
            <label>Début de récolte réelle</label>
            <input type="date" id="p_date_recolte">
            
            <label>Période de récolte prévue (Prévisions)</label>
            <div class="mois-grid" id="moisGrid"></div>
            
            <label>Date Arrachage / Fin</label>
            <input type="date" id="p_date_fin">
            
            <button type="button" onclick="validerFormulaire()" style="width:100%; padding:18px; background:var(--primary); color:white; border:none; border-radius:8px; margin-top:20px; font-weight:bold;">SAUVEGARDER</button>
            <button type="button" onclick="switchTab('tab-liste')" style="width:100%; padding:12px; background:#ddd; border:none; border-radius:8px; margin-top:10px;">RETOUR</button>
        </form>
    </div>
</div>

<script>
let monPotager = JSON.parse(localStorage.getItem("data_potager")) || [];
const MOIS_NOM = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Juil", "Août", "Sept", "Oct", "Nov", "Déc"];
const TODAY = new Date();

// Remplissage du sélecteur de rangs
const selectRang = document.getElementById('p_rang');
for(let i=1; i<=30; i++) { 
    let o = document.createElement('option'); o.value = i; o.innerText = "Rang n°" + i; 
    selectRang.appendChild(o); 
}
// Remplissage de la grille des mois
document.getElementById('moisGrid').innerHTML = MOIS_NOM.map(m => `<div><input type="checkbox" name="mr" value="${m}"> ${m}</div>`).join('');

function switchTab(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 'tab-liste') { 
        document.getElementById('btn-list').classList.add('active'); 
        afficherListe(); 
    } else if(id === 'tab-planning') { 
        document.getElementById('btn-plan').classList.add('active'); 
        genererPlanning(); 
    }
}

function getStatutInfo(p, dateRef = TODAY) {
    const dS = p.date ? new Date(p.date) : null;
    const dL = p.dateLevee ? new Date(p.dateLevee) : null;
    const dR = p.dateRecolte ? new Date(p.dateRecolte) : null;
    const dF = (p.dateFin && p.dateFin !== "") ? new Date(p.dateFin) : null;
    
    if (dF && dateRef >= dF) return { color: "gris", text: "Fini" };
    if (dR && dateRef >= dR) return { color: "vert", text: "Récolte" };
    if (p.typeInit === 'semis') {
        if (dL && dateRef >= dL) return { color: "violet", text: "Levé" };
        if (dS && dateRef >= dS) return { color: "bleu", text: "Semé" };
    } else {
        if (dS && dateRef >= dS) return { color: "violet", text: "Planté" };
    }
    return { color: "gris", text: "Attente" };
}

function afficherListe() {
    const cont = document.getElementById('tab-liste'); cont.innerHTML = "";
    if(monPotager.length === 0) { cont.innerHTML = "<p style='text-align:center; color:#888; margin-top:50px;'>Aucun légume enregistré.<br>Appuyez sur le + pour commencer.</p>"; return; }
    
    monPotager.forEach((z, zi) => {
        let cards = "";
        z.rangs.forEach((r, ri) => r.plantes.forEach((p, pi) => {
            const st = getStatutInfo(p);
            cards += `<div class="plante-card" onclick="edit(${zi},${ri},${pi})">
                <span class="status-badge" style="background:var(--c-${st.color})">${st.text}</span>
                <strong>${p.nom}</strong><br>
                <small style="color:#666">Rang ${r.numero} • ${p.typeInit}</small>
            </div>`;
        }));
        if(cards) cont.innerHTML += `<div class="zone-box"><h3>Zone ${z.nom}</h3>${cards}</div>`;
    });
}

function genererPlanning() {
    const hY = document.getElementById('p-years'), hM = document.getElementById('p-months'), body = document.getElementById('p-body');
    hY.innerHTML = hM.innerHTML = '<th class="col-nom">Légume</th>';
    
    for(let y=2025; y<=2026; y++) {
        hY.innerHTML += `<th colspan="12" style="background:#444; color:white">${y}</th>`;
        MOIS_NOM.forEach(m => hM.innerHTML += `<th>${m}</th>`);
    }

    body.innerHTML = "";
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes.forEach(p => {
        let row = `<tr><td class="col-nom">${p.nom}<br><small>Z:${z.nom} R:${r.numero}</small></td>`;
        const dS = p.date ? new Date(p.date) : null;
        const dF = (p.dateFin && p.dateFin !== "") ? new Date(p.dateFin) : null;

        for(let y=2025; y<=2026; y++) {
            MOIS_NOM.forEach((m, mi) => {
                const dMoisDeb = new Date(y, mi, 1);
                const dMoisFin = new Date(y, mi + 1, 0);
                let bars = [];
                
                if (dS) {
                    // 1. Prévision orange (Seulement si mois >= mois de plantation)
                    if (p.recolte && p.recolte.includes(m) && dMoisFin >= dS) {
                        bars.push("bg-prev");
                    }
                    
                    // 2. Statut réel (passé et présent uniquement)
                    if (dMoisDeb <= TODAY && dS <= dMoisFin) {
                        const st = getStatutInfo(p, dMoisFin);
                        if (st && st.color !== "gris") bars.push("bg-" + st.color);
                        else if (st && st.color === "gris" && dF && dF >= dMoisDeb && dF <= dMoisFin) bars.push("bg-gris");
                    }
                }
                
                row += `<td><div class="bar-container">${[...new Set(bars)].map(b => `<div class="bar ${b}"></div>`).join('')}</div></td>`;
            });
        }
        body.innerHTML += row + "</tr>";
    })));
}

function validerFormulaire() {
    const id = document.getElementById('edit-id').value || Date.now();
    const p = {
        id: parseInt(id), nom: document.getElementById('p_nom').value,
        typeInit: document.getElementById('p_init').value,
        date: document.getElementById('p_date').value,
        dateLevee: document.getElementById('p_date_levee').value,
        dateRecolte: document.getElementById('p_date_recolte').value,
        dateFin: document.getElementById('p_date_fin').value,
        recolte: Array.from(document.querySelectorAll('input[name="mr"]:checked')).map(c => c.value)
    };
    const zN = (document.getElementById('p_zone').value || "A").toUpperCase();
    const rN = document.getElementById('p_rang').value;

    // Supprimer l'ancienne version si édition
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(x => x.id !== p.id)));
    
    // Ajouter à la nouvelle place
    let z = monPotager.find(x => x.nom === zN); 
    if(!z) { z = {nom:zN, rangs:[]}; monPotager.push(z); }
    let r = z.rangs.find(x => x.numero === rN); 
    if(!r) { r = {numero:rN, plantes:[]}; z.rangs.push(r); }
    r.plantes.push(p);

    localStorage.setItem("data_potager", JSON.stringify(monPotager));
    switchTab('tab-liste');
}

function edit(zi, ri, pi) {
    const p = monPotager[zi].rangs[ri].plantes[pi];
    ouvrirAjout();
    document.getElementById('edit-id').value = p.id;
    document.getElementById('p_nom').value = p.nom;
    document.getElementById('p_zone').value = monPotager[zi].nom;
    document.getElementById('p_rang').value = monPotager[zi].rangs[ri].numero;
    document.getElementById('p_date').value = p.date;
    document.getElementById('p_date_levee').value = p.dateLevee;
    document.getElementById('p_date_recolte').value = p.dateRecolte;
    document.getElementById('p_date_fin').value = p.dateFin;
    document.querySelectorAll('input[name="mr"]').forEach(c => c.checked = p.recolte.includes(c.value));
    toggleLeveeField(p.typeInit);
    document.getElementById('p_init').value = p.typeInit;
}

function ouvrirAjout() {
    document.getElementById('pForm').reset();
    document.getElementById('edit-id').value = "";
    toggleLeveeField('semis');
    switchTab('tab-saisie');
}

function toggleLeveeField(v) { 
    document.getElementById('field-levee').style.display = (v === 'semis' ? 'block' : 'none'); 
    document.getElementById('lbl_date_main').innerText = (v === 'semis' ? "Date du semis" : "Date de plantation");
}

// Lancement au démarrage
afficherListe();
</script>
</body>
</html>
