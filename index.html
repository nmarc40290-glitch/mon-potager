<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Potager - Gestion Solo</title>
    <style>
        :root { 
            --primary: #2e7d32; --primary-light: #e8f5e9; --accent: #4caf50; 
            --danger: #d32f2f; --bg: #f4f9f4; --text: #2c3e50;
            --c-sous-terre: #2196f3; --c-attente: #9c27b0; --c-recolte: #1b5e20; --c-fini: #757575;
        }

        /* RESET & BASE */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; 
            background-color: var(--bg); color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* BANDEAU (HEADER) */
        header { 
            background: var(--primary); color: white; padding: 0 15px;
            height: 60px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 1000; flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .btn-menu { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 5px; }
        
        /* SIDEBAR (FILTRES & DATAS) */
        .sidebar { 
            position: fixed; left: 0; top: 60px; bottom: 0; width: 280px;
            background: white; border-right: 1px solid #ddd; z-index: 900;
            transform: translateX(-100%); transition: transform 0.3s ease;
            display: flex; flex-direction: column;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 20px; }
        .sb-section { margin-bottom: 25px; }
        .sb-section h3 { font-size: 0.75em; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        
        .cat-link { display: block; padding: 10px; color: var(--text); text-decoration: none; border-radius: 5px; cursor: pointer; font-size: 0.9em; margin-bottom: 2px; }
        .cat-link:hover { background: var(--primary-light); }
        .cat-link.active { background: var(--primary); color: white; }

        /* ZONE PRINCIPALE (CONTENU) */
        main { flex: 1; position: relative; overflow-y: auto; }
        .page { display: none; padding: 15px; width: 100%; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; }

        /* LISTE DES PLANTES */
        .zone-box { background: white; margin-bottom: 20px; border-radius: 12px; border-left: 6px solid var(--primary); padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .zone-box h2 { margin-top: 0; font-size: 1.1em; color: var(--primary); border-bottom: 1px solid #eee; padding-bottom: 8px; }
        
        .plante-card { 
            background: #fff; border: 1px solid #f0f0f0; margin: 10px 0; padding: 15px; 
            border-radius: 10px; cursor: pointer; transition: 0.2s; position: relative;
        }
        .plante-card:active { transform: scale(0.98); background: #fafafa; }
        .status-badge { float: right; font-size: 0.65em; padding: 4px 8px; border-radius: 4px; color: white; font-weight: bold; }

        /* FORMULAIRE DE SAISIE */
        .form-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85em; font-weight: bold; margin-bottom: 5px; color: #555; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }

        /* BOUTONS */
        .fab-add { 
            position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px; 
            background: var(--accent); color: white; border: none; border-radius: 50%; 
            font-size: 35px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 800;
        }
        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-save { background: var(--primary); color: white; }
        .btn-cancel { background: #eee; color: #666; }
        .btn-del { background: none; color: var(--danger); }
        .btn-data { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; background: #f9f9f9; border-radius: 5px; cursor: pointer; }

        /* ETATS COULEURS */
        .st-bleu { background: var(--c-sous-terre); }
        .st-violet { background: var(--c-attente); }
        .st-vert { background: var(--c-recolte); }
        .st-gris { background: var(--c-fini); }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <button class="btn-menu" onclick="toggleSidebar()">☰</button>
        <strong id="header-title">Ma Liste</strong>
    </div>
    <div id="filter-indicator" style="font-size: 0.7em; opacity: 0.8;"></div>
</header>

<!-- MENU LATÉRAL -->
<aside id="sidebar" class="sidebar">
    <div class="sidebar-content">
        <div class="sb-section">
            <h3>Vue</h3>
            <a class="cat-link active" id="link-all" onclick="filtrer('tout', null)">📋 Toutes les plantes</a>
        </div>
        <div id="dynamic-filters">
            <!-- Rempli par JS -->
        </div>
        <hr>
        <div class="sb-section">
            <h3>Sauvegarde</h3>
            <button class="btn-data" onclick="exportData()">📤 Exporter (JSON)</button>
            <button class="btn-data" onclick="document.getElementById('fileInput').click()">📥 Importer</button>
            <input type="file" id="fileInput" style="display:none" onchange="importData(event)">
        </div>
    </div>
</aside>

<main>
    <!-- PAGE 1 : LA LISTE -->
    <div id="page-list" class="page active">
        <div id="affichageDonnees"></div>
        <button class="fab-add" onclick="ouvrirSaisie()">+</button>
    </div>

    <!-- PAGE 2 : LE FORMULAIRE -->
    <div id="page-form" class="page">
        <div class="form-card">
            <form id="pForm">
                <input type="hidden" id="edit-id">
                
                <div class="form-group">
                    <label>Méthode</label>
                    <select id="p_init" onchange="toggleLeveeField(this.value)">
                        <option value="semis">🌱 Semis (Graines)</option>
                        <option value="planter">🚜 Plantation (Plants)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nom du légume & Variété</label>
                    <input type="text" id="p_nom" required placeholder="Ex: Tomate Marmande">
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Zone</label>
                        <input type="text" id="p_zone" placeholder="Ex: A">
                    </div>
                    <div class="form-group">
                        <label>Rang / Emplacement</label>
                        <input type="number" id="p_rang" value="1">
                    </div>
                </div>

                <div id="field-levee" class="form-group">
                    <label>Date de levée constatée</label>
                    <input type="date" id="p_date_levee">
                </div>

                <div class="form-group">
                    <label id="lbl_date_main">Date Semis</label>
                    <input type="date" id="p_date">
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Début Récolte</label>
                        <input type="date" id="p_date_recolte">
                    </div>
                    <div class="form-group">
                        <label>Fin / Arrachage</label>
                        <input type="date" id="p_date_fin">
                    </div>
                </div>

                <div class="form-group">
                    <label>Notes & Suivi</label>
                    <textarea id="p_notes" rows="4" placeholder="Engrais, arrosage, météo..."></textarea>
                </div>

                <button type="button" class="btn-action btn-save" onclick="validerFormulaire()">💾 ENREGISTRER</button>
                <button type="button" id="dup-btn" class="btn-action" style="background:#d4edda; color:#155724;" onclick="dupliquerPlante()">👯 DUPLIQUER</button>
                <button type="button" id="del-btn" class="btn-action btn-del" onclick="supprimerPlante()">Supprimer cette fiche</button>
                <button type="button" class="btn-action btn-cancel" onclick="fermerSaisie()">ANNULER</button>
            </form>
        </div>
    </div>
</main>

<script>
let monPotager = JSON.parse(localStorage.getItem("data_potager")) || [];
let filtreActuel = { type: 'tout', valeur: null };
const TODAY = new Date();

// --- NAVIGATION ---
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

function ouvrirSaisie(editData = null) {
    const form = document.getElementById('pForm');
    form.reset();
    document.getElementById('edit-id').value = "";
    document.getElementById('del-btn').style.display = "none";
    document.getElementById('dup-btn').style.display = "none";
    document.getElementById('header-title').innerText = "Nouvelle Culture";
    
    if(editData) {
        document.getElementById('header-title').innerText = "Modifier " + editData.nom;
        document.getElementById('edit-id').value = editData.id;
        document.getElementById('p_nom').value = editData.nom;
        document.getElementById('p_init').value = editData.typeInit || "semis";
        document.getElementById('p_zone').value = editData.zoneName;
        document.getElementById('p_rang').value = editData.rangNum;
        document.getElementById('p_date').value = editData.date || "";
        document.getElementById('p_date_levee').value = editData.dateLevee || "";
        document.getElementById('p_date_recolte').value = editData.dateRecolte || "";
        document.getElementById('p_date_fin').value = (editData.dateFin === "Non définie") ? "" : editData.dateFin;
        document.getElementById('p_notes').value = editData.notes || "";
        document.getElementById('del-btn').style.display = "block";
        document.getElementById('dup-btn').style.display = "block";
    }

    toggleLeveeField(document.getElementById('p_init').value);
    document.getElementById('page-list').classList.remove('active');
    document.getElementById('page-form').classList.add('active');
}

function fermerSaisie() {
    document.getElementById('header-title').innerText = "Ma Liste";
    document.getElementById('page-form').classList.remove('active');
    document.getElementById('page-list').classList.add('active');
    updateSidebar();
    afficherPotager();
}

function toggleLeveeField(v) {
    document.getElementById('field-levee').style.display = (v === 'semis' ? 'block' : 'none');
    document.getElementById('lbl_date_main').innerText = (v === 'semis' ? "Date Semis" : "Date Plantation");
}

// --- LOGIQUE DONNÉES ---
function getStatutInfo(p) {
    const dStart = p.date ? new Date(p.date) : null;
    const dLevee = p.dateLevee ? new Date(p.dateLevee) : null;
    const dRec = p.dateRecolte ? new Date(p.dateRecolte) : null;
    const dFin = (p.dateFin && p.dateFin !== "Non définie") ? new Date(p.dateFin) : null;

    if (dFin && TODAY >= dFin) return { text: "Terminé", color: "gris" };
    if (dRec && TODAY >= dRec) return { text: "En Récolte", color: "vert" };
    if (p.typeInit === 'semis') {
        if (dLevee && TODAY >= dLevee) return { text: "Levé", color: "violet" };
        return { text: "En terre", color: "bleu" };
    }
    return { text: "Planté", color: "violet" };
}

function afficherPotager() {
    const container = document.getElementById('affichageDonnees');
    container.innerHTML = "";
    
    // On trie les zones
    monPotager.sort((a,b) => a.nom.localeCompare(b.nom)).forEach(zone => {
        let cardsHtml = "";
        zone.rangs.sort((a,b) => a.numero - b.numero).forEach(rang => {
            rang.plantes.forEach(p => {
                if (filtreActuel.type === 'tout' || 
                   (filtreActuel.type === 'nom' && filtreActuel.valeur === p.nom) || 
                   (filtreActuel.type === 'zone' && filtreActuel.valeur === zone.nom)) {
                    
                    const info = getStatutInfo(p);
                    cardsHtml += `
                        <div class="plante-card" onclick='preparerModif("${zone.nom}", ${rang.numero}, ${p.id})'>
                            <span class="status-badge st-${info.color}">${info.text}</span>
                            <strong>${p.nom}</strong><br>
                            <small>Rang ${rang.numero} • ${p.notes ? '📝' : ''}</small>
                        </div>`;
                }
            });
        });
        if(cardsHtml) {
            container.innerHTML += `<div class="zone-box"><h2>Zone ${zone.nom}</h2>${cardsHtml}</div>`;
        }
    });
}

function preparerModif(zoneNom, rangNum, planteId) {
    const zone = monPotager.find(z => z.nom === zoneNom);
    const rang = zone.rangs.find(r => r.numero == rangNum);
    const plante = rang.plantes.find(p => p.id == planteId);
    ouvrirSaisie({...plante, zoneName: zoneNom, rangNum: rangNum});
}

function validerFormulaire() {
    const nom = document.getElementById('p_nom').value;
    if(!nom) return alert("Nom requis");

    const id = document.getElementById('edit-id').value ? parseInt(document.getElementById('edit-id').value) : Date.now();
    const p = {
        id: id,
        nom: nom,
        typeInit: document.getElementById('p_init').value,
        date: document.getElementById('p_date').value,
        dateLevee: document.getElementById('p_date_levee').value,
        dateRecolte: document.getElementById('p_date_recolte').value,
        dateFin: document.getElementById('p_date_fin').value || "Non définie",
        notes: document.getElementById('p_notes').value
    };

    const zN = document.getElementById('p_zone').value.toUpperCase() || "A";
    const rN = parseInt(document.getElementById('p_rang').value) || 1;

    // Suppression de l'ancienne version si existante
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(x => x.id !== id)));

    // Ajout
    let z = monPotager.find(x => x.nom === zN); if(!z){z={nom:zN, rangs:[]}; monPotager.push(z);}
    let r = z.rangs.find(x => x.numero == rN); if(!r){r={numero:rN, plantes:[]}; z.rangs.push(r);}
    r.plantes.push(p);

    sauvegarder();
    fermerSaisie();
}

function dupliquerPlante() {
    document.getElementById('edit-id').value = "";
    validerFormulaire();
}

function supprimerPlante() {
    if(confirm("Supprimer cette fiche ?")) {
        const id = parseInt(document.getElementById('edit-id').value);
        monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(x => x.id !== id)));
        sauvegarder();
        fermerSaisie();
    }
}

function filtrer(type, val) {
    filtreActuel = { type, valeur: val };
    document.getElementById('filter-indicator').innerText = val ? `Filtre : ${val}` : "";
    document.querySelectorAll('.cat-link').forEach(l => l.classList.remove('active'));
    if(!val) document.getElementById('link-all').classList.add('active');
    toggleSidebar();
    afficherPotager();
}

function updateSidebar() {
    const data = { zones: new Set(), plantes: new Set() };
    monPotager.forEach(z => { 
        data.zones.add(z.nom); 
        z.rangs.forEach(r => r.plantes.forEach(p => data.plantes.add(p.nom))); 
    });

    const div = document.getElementById('dynamic-filters');
    div.innerHTML = "";

    const createGroup = (label, set, type) => {
        let h = `<div class="sb-section"><h3>${label}</h3>`;
        Array.from(set).sort().forEach(v => {
            h += `<a class="cat-link" onclick="filtrer('${type}', '${v}')">${v}</a>`;
        });
        div.innerHTML += h + `</div>`;
    };

    if(data.zones.size > 0) createGroup("Zones", data.zones, 'zone');
    if(data.plantes.size > 0) createGroup("Légumes", data.plantes, 'nom');
}

function sauvegarder() { localStorage.setItem("data_potager", JSON.stringify(monPotager)); }

function exportData() {
    const blob = new Blob([JSON.stringify(monPotager)], {type: "application/json"});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "potager_data.json"; a.click();
}

function importData(e) {
    const reader = new FileReader();
    reader.onload = (ev) => { 
        monPotager = JSON.parse(ev.target.result); 
        sauvegarder(); 
        location.reload(); 
    };
    reader.readAsText(e.target.files[0]);
}

// Init
updateSidebar();
afficherPotager();
</script>

</body>
</html>
