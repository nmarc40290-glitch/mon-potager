<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potager SQL Dynamique FIX</title>
    <style>
        :root { --primary: #2e7d32; --bg: #f4f9f4; --accent: #4caf50; --danger: #d32f2f; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        nav { background: var(--primary); color: white; padding: 10px; display: flex; gap: 10px; align-items: center; z-index: 1000; }
        .nav-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.8em; }
        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        .sidebar { width: 260px; background: white; border-right: 1px solid #ddd; padding: 15px; position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: 0.3s; z-index: 1100; box-shadow: 5px 0 15px rgba(0,0,0,0.1); }
        .sidebar.open { transform: translateX(0); }
        .content-area { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .section { display: none; }
        .section.active { display: block; }
        
        /* FORMULAIRE */
        form { background: white; padding: 20px; border-radius: 12px; max-width: 500px; margin: 0 auto; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        label { display: block; font-size: 0.8em; font-weight: bold; margin-top: 10px; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        
        .custom-field-row { background: #fffde7; padding: 10px; border-radius: 6px; margin-top: 10px; border: 1px solid #ffd54f; position: relative; }
        .btn-remove-field { position: absolute; top: 5px; right: 5px; color: var(--danger); border: none; background: none; font-weight: bold; cursor: pointer; font-size: 1.2em; }
        .btn-add-field { background: #eceff1; border: 2px dashed #90a4ae; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 15px 0; color: #455a64; }

        /* TABLEAU SQL */
        .sql-table-container { width: 100%; overflow-x: auto; background: white; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75em; min-width: 1000px; }
        th { background: #34495e; color: white; padding: 10px; text-align: left; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        
        .fab-add { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 30px; z-index: 2000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; }
        .plante-card { background: white; border: 1px solid #ddd; padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<nav>
    <div onclick="toggleSidebar()" style="cursor:pointer; font-weight:900; margin-right:10px;">☰ MENU</div>
    <button class="nav-btn" onclick="switchTab('tab-liste')">LISTE</button>
    <button class="nav-btn" onclick="switchTab('tab-sql')">TABLEAU SQL</button>
</nav>

<div class="main-container">
    <aside id="sidebar" class="sidebar">
        <h3>Options</h3>
        <button onclick="exportData()" style="width:100%; padding:10px; margin-bottom:10px;">📤 Exporter</button>
        <button onclick="document.getElementById('fileInput').click()" style="width:100%; padding:10px;">📥 Importer</button>
        <input type="file" id="fileInput" style="display:none" onchange="importData(event)">
    </aside>

    <main class="content-area">
        <div id="tab-liste" class="section active"><div id="affichageDonnees"></div></div>
        <div id="tab-sql" class="section"><div class="sql-table-container"><table><thead id="sql-head"></thead><tbody id="sql-body"></tbody></table></div></div>

        <div id="tab-saisie" class="section">
            <form id="pForm">
                <input type="hidden" id="edit-id">
                <label>Nom du légume</label>
                <input type="text" id="p_nom" required>
                
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;"><label>Zone</label><input type="text" id="p_zone"></div>
                    <div style="flex:1;"><label>Rang</label><select id="p_rang"></select></div>
                </div>

                <label>Date Semis/Plantation</label><input type="date" id="p_date">
                
                <!-- Zone où les champs dynamiques s'affichent -->
                <div id="dynamic-fields-container"></div>
                
                <button type="button" class="btn-add-field" onclick="demanderNouveauChamp()">➕ AJOUTER UN CHAMP SQL / LIBRE</button>

                <div style="display:flex; flex-direction:column; gap:10px;">
                    <button type="button" onclick="enregistrerPlante()" style="background:var(--primary); color:white; padding:15px; border:none; border-radius:8px; font-weight:bold;">💾 ENREGISTRER</button>
                    <button type="button" onclick="switchTab('tab-liste')" style="background:#ccc; padding:10px; border:none; border-radius:8px;">ANNULER</button>
                </div>
            </form>
        </div>
    </main>
</div>

<button class="fab-add" onclick="ouvrirAjout()">+</button>

<script>
let monPotager = JSON.parse(localStorage.getItem("data_potager")) || [];
const CHAMPS_SYSTEME = ['id', 'nom', 'zone', 'numero', 'date', 'statut', 'rang', 'typeInit', 'recolte', 'dateLevee', 'dateRecolte', 'dateFin'];

// Init Rangs
const selectRang = document.getElementById('p_rang');
for(let i=1; i<=30; i++) { let o = document.createElement('option'); o.value = i; o.innerText = "Rang " + i; selectRang.appendChild(o); }

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function switchTab(t) { 
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(t).classList.add('active');
    if(t === 'tab-liste') afficherPotager();
    if(t === 'tab-sql') afficherTableauSQL();
    document.getElementById('sidebar').classList.remove('open');
}

// --- GESTION DYNAMIQUE ---

function demanderNouveauChamp() {
    // Lister les champs existants dans la base pour aider l'utilisateur
    let clesExistantes = new Set();
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes.forEach(p => {
        Object.keys(p).forEach(k => { if(!CHAMPS_SYSTEME.includes(k)) clesExistantes.add(k); });
    })));

    let aide = clesExistantes.size > 0 ? "\n(Champs SQL existants : " + Array.from(clesExistantes).join(', ') + ")" : "";
    let nomChamp = prompt("Entrez le nom du nouveau champ :" + aide);
    
    if(nomChamp && nomChamp.trim() !== "") {
        ajouterInputChamp(nomChamp.trim(), "");
    }
}

function ajouterInputChamp(label, valeur) {
    const container = document.getElementById('dynamic-fields-container');
    const div = document.createElement('div');
    div.className = 'custom-field-row';
    // On utilise dataset pour stocker le nom de la clé SQL
    div.innerHTML = `
        <button type="button" class="btn-remove-field" onclick="this.parentElement.remove()">×</button>
        <label>${label.toUpperCase()}</label>
        <input type="text" class="input-dynamique" data-key="${label}" value="${valeur}">
    `;
    container.appendChild(div);
}

// --- CRUD ---

function enregistrerPlante() {
    const nom = document.getElementById('p_nom').value;
    if(!nom) return alert("Le nom est obligatoire");

    // 1. Création de l'objet plante
    const plante = {
        id: document.getElementById('edit-id').value ? parseInt(document.getElementById('edit-id').value) : Date.now(),
        nom: nom,
        date: document.getElementById('p_date').value
    };

    // 2. Récupération des champs dynamiques
    const inputsDyn = document.querySelectorAll('.input-dynamique');
    inputsDyn.forEach(inp => {
        plante[inp.dataset.key] = inp.value;
    });

    const zoneNom = document.getElementById('p_zone').value.toUpperCase() || "A";
    const rangNum = document.getElementById('p_rang').value;

    // 3. Mise à jour de la base (suppression de l'ancienne version si édition)
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes = r.plantes.filter(p => p.id !== plante.id)));
    
    let z = monPotager.find(x => x.nom === zoneNom);
    if(!z) { z = {nom: zoneNom, rangs: []}; monPotager.push(z); }
    
    let r = z.rangs.find(x => x.numero === rangNum);
    if(!r) { r = {numero: rangNum, plantes: []}; z.rangs.push(r); }
    
    r.plantes.push(plante);
    
    localStorage.setItem("data_potager", JSON.stringify(monPotager));
    switchTab('tab-liste');
}

function preparerEdition(zi, ri, pi) {
    const p = monPotager[zi].rangs[ri].plantes[pi];
    ouvrirAjout(); // Réinitialise tout proprement
    
    document.getElementById('edit-id').value = p.id;
    document.getElementById('p_nom').value = p.nom;
    document.getElementById('p_zone').value = monPotager[zi].nom;
    document.getElementById('p_rang').value = monPotager[zi].rangs[ri].numero;
    document.getElementById('p_date').value = p.date || "";

    // Afficher les champs dynamiques stockés dans cette plante
    Object.keys(p).forEach(cle => {
        if(!CHAMPS_SYSTEME.includes(cle)) {
            ajouterInputChamp(cle, p[cle]);
        }
    });
}

function ouvrirAjout() {
    document.getElementById('pForm').reset();
    document.getElementById('edit-id').value = "";
    document.getElementById('dynamic-fields-container').innerHTML = ""; // Vide les champs dynamiques
    switchTab('tab-saisie');
}

// --- AFFICHAGE & SQL ---

function afficherPotager() {
    const cont = document.getElementById('affichageDonnees'); cont.innerHTML = "";
    monPotager.forEach((z, zi) => {
        let html = `<div class="zone-box"><h3>ZONE ${z.nom}</h3>`;
        z.rangs.forEach((r, ri) => r.plantes.forEach((p, pi) => {
            html += `<div class="plante-card" onclick="preparerEdition(${zi},${monPotager[zi].rangs.indexOf(r)},${pi})">
                <strong>${p.nom}</strong> <small>(Rang ${r.numero})</small>
            </div>`;
        }));
        cont.innerHTML += html + `</div>`;
    });
}

function afficherTableauSQL() {
    const head = document.getElementById('sql-head');
    const body = document.getElementById('sql-body');
    
    // Trouver toutes les colonnes possibles
    let cols = new Set(['id', 'zone', 'rang', 'nom', 'date']);
    monPotager.forEach(z => z.rangs.forEach(r => r.plantes.forEach(p => {
        Object.keys(p).forEach(k => { if(!['recolte','typeInit'].includes(k)) cols.add(k); });
    })));

    let colArr = Array.from(cols);
    head.innerHTML = `<tr>${colArr.map(c => `<th>${c.toUpperCase()}</th>`).join('')}</tr>`;
    body.innerHTML = "";

    monPotager.forEach((z, zi) => z.rangs.forEach((r, ri) => r.plantes.forEach((p, pi) => {
        let tr = document.createElement('tr');
        tr.onclick = () => preparerEdition(zi, monPotager[zi].rangs.indexOf(r), pi);
        tr.innerHTML = colArr.map(c => {
            let val = (c === 'zone') ? z.nom : (c === 'rang') ? r.numero : (p[c] || "-");
            return `<td>${val}</td>`;
        }).join('');
        body.appendChild(tr);
    })));
}

function exportData() {
    const blob = new Blob([JSON.stringify(monPotager)], {type: "application/json"});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "potager.json"; a.click();
}

function importData(e) {
    const reader = new FileReader();
    reader.onload = (ev) => { 
        monPotager = JSON.parse(ev.target.result); 
        localStorage.setItem("data_potager", JSON.stringify(monPotager)); 
        afficherPotager(); 
    };
    reader.readAsText(e.target.files[0]);
}

afficherPotager();
</script>
</body>
</html>
